<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liora 的学习小屋</title>
<link rel="icon" href="favicon.ico?v=20261106-crest1" sizes="any">
<link rel="apple-touch-icon" href="cabin-art/crest-apple-touch-180.png?v=20261106-crest1">
<link rel="icon" type="image/png" sizes="64x64" href="cabin-art/crest-icon-64.png?v=20261106-crest1">
<link rel="icon" type="image/png" sizes="192x192" href="cabin-art/crest-icon-192.png?v=20261106-crest1">
<style>
:root{
  --navy-900:#0b2545; --navy-800:#13315c; --navy-700:#1d4368; --navy-100:#e8eef6; --navy-050:#f3f6fa;
  --gold:#c9a227; --gold-deep:#a8831a; --gold-light:#f7efd8;
  --paper:#f4f6f9; --card:#ffffff;
  --ink:#16202b; --ink-2:#3c4a5a; --muted:#68788c;
  --line:#dde4ec; --line-2:#e9edf3;
  --green:#276749; --green-bg:#e6f4ec; --red:#b03030; --red-bg:#fbeaea;
  --amber:#9c6b12; --amber-bg:#fdf3e0; --blue:#1d4e89; --blue-bg:#e8f0fa;
  --shadow:0 1px 3px rgba(11,37,69,.07),0 1px 2px rgba(11,37,69,.05);
  --shadow-md:0 4px 14px rgba(11,37,69,.10);
  --shadow-lg:0 14px 40px rgba(11,37,69,.16);
  --serif:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --radius:10px;
  --rf:1.9; /* 字号缩放系数：正文 19px 为基准（中档默认值） */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--gold-light)}


/* ============ header ============ */
.site-header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(11,37,69,.05)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
.brand-crest{width:38px;height:44px;flex-shrink:0;object-fit:contain}
.brand-text .t1{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy-900);letter-spacing:.5px;line-height:1.2}
.brand-text .t2{font-size:11px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase}
.main-nav{display:flex;gap:4px;margin-left:8px}
.main-nav a{padding:8px 14px;border-radius:6px;color:var(--ink-2);font-size:14px;font-weight:500}
.main-nav a:hover{background:var(--navy-050);text-decoration:none;color:var(--navy-800)}
.main-nav a.active{color:var(--navy-900);background:var(--navy-100);font-weight:600}
.search-wrap{margin-left:auto;position:relative;flex-shrink:0}
.search-box{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 14px;width:230px;transition:all .2s}
.search-box:focus-within{border-color:var(--navy-700);background:#fff;box-shadow:0 0 0 3px rgba(29,67,104,.08);width:260px}
.search-box input{border:none;outline:none;background:transparent;font-size:13px;width:100%;color:var(--ink);font-family:var(--sans)}
.search-box svg{flex-shrink:0;margin-right:6px}
.search-results{position:absolute;top:calc(100% + 6px);right:0;width:340px;max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);display:none;z-index:200}
.search-results.open{display:block}
.sr-group{font-size:11px;color:var(--muted);padding:8px 14px 4px;letter-spacing:1px;font-weight:600}
.sr-item{display:block;padding:8px 14px;border-left:3px solid transparent;cursor:pointer}
.sr-item:hover{background:var(--navy-050);border-left-color:var(--gold);text-decoration:none}
.sr-item .sr-t{font-size:13px;color:var(--navy-800);font-weight:600}
.sr-item .sr-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-empty{padding:16px 14px;font-size:13px;color:var(--muted);text-align:center}

/* ============ hero ============ */
.hero{background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 55%,#1a4a7d 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:22px 22px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold) 0%,var(--gold-deep) 100%)}
.hero-inner{max-width:1200px;margin:0 auto;padding:56px 24px 64px;display:flex;gap:48px;align-items:center;position:relative;z-index:1}
.hero-left{flex:1.35;min-width:0}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:600;margin-bottom:14px;text-transform:uppercase}
.hero-kicker::before{content:"";width:26px;height:2px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-size:42px;line-height:1.2;font-weight:700;margin-bottom:16px;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero-sub{font-size:15.5px;color:#c9d6e6;max-width:560px;margin-bottom:28px;line-height:1.8}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:var(--sans);transition:all .15s}
.btn-gold{background:var(--gold);color:var(--navy-900)}
.btn-gold:hover{background:#dcb63c;text-decoration:none;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn-ghost:hover{background:rgba(255,255,255,.1);text-decoration:none}
.hero-right{flex:1;max-width:380px}
.hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:24px;backdrop-filter:blur(6px)}
.hero-card h3{font-size:13px;letter-spacing:2px;color:var(--gold);margin-bottom:16px;font-weight:600}
.hc-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.14);font-size:13.5px}
.hc-row:last-child{border-bottom:none}
.hc-row .k{color:#a9bad0}
.hc-row .v{color:#fff;font-weight:600}
.hc-date{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;color:#8fa5c0;text-align:right}

/* ============ layout ============ */
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:44px 0 8px}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;border-bottom:2px solid var(--navy-900);padding-bottom:10px}
.section-head h2{font-family:var(--serif);font-size:24px;color:var(--navy-900);font-weight:700}
.section-head .en{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.section-head .more{margin-left:auto;font-size:13px}

/* ============ stats ============ */
.stats-band{background:#fff;border-bottom:1px solid var(--line)}
.stats-inner{max-width:1200px;margin:0 auto;padding:26px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat{text-align:center;padding:8px 0;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.stat .num{font-family:var(--serif);font-size:32px;font-weight:700;color:var(--navy-900)}
.stat .num span{color:var(--gold)}
.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:2px;letter-spacing:1px}

/* ============ course cards ============ */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}
.course-card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:all .18s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#c8d3e0;text-decoration:none}
.cc-top{height:6px}
.cc-body{padding:20px 20px 16px;flex:1}
.cc-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.cc-name{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--navy-900);line-height:1.3}
.cc-name-en{font-size:12.5px;color:var(--muted);margin:3px 0 12px;line-height:1.4}
.cc-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--navy-050);color:var(--ink-2);border:1px solid var(--line-2);font-weight:500}
.chip-gold{background:var(--gold-light);color:var(--amber);border-color:#ead9ac}
.cc-progress{padding:0 20px 18px}
.cc-progress .bar{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}
.cc-progress .bar i{display:block;height:100%;border-radius:3px;transition:width .4s}
.cc-progress .txt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.cc-foot{padding:12px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--blue);font-weight:600;background:#fcfdfe}

/* ============ future / coming cards ============ */
.coming-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}
.coming-card{border:2px dashed #c8d3e0;border-radius:var(--radius);padding:24px 20px;background:#fbfcfe;text-align:center;transition:all .15s}
.coming-card:hover{border-color:var(--gold);background:#fffdf6}
.coming-card .emoji{font-size:30px;margin-bottom:10px}
.coming-card h4{font-family:var(--serif);font-size:17px;color:var(--navy-900);margin-bottom:6px}
.coming-card p{font-size:12.5px;color:var(--muted);line-height:1.6}
.coming-card .badge{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:1px;color:var(--amber);background:var(--gold-light);border:1px solid #ead9ac;padding:2px 10px;border-radius:12px;font-weight:600}

/* ============ service cards ============ */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.svc-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.svc-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--gold)}
.svc-card .n{font-family:var(--serif);font-size:13px;color:var(--gold-deep);letter-spacing:2px;font-weight:700}
.svc-card h4{font-size:17px;color:var(--navy-900);margin:8px 0 10px;font-family:var(--serif)}
.svc-card p{font-size:13px;color:var(--ink-2);line-height:1.75}

/* ============ course page ============ */
.crumb{font-size:12.5px;color:var(--muted);padding:16px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--blue)}
.crumb .sep{color:#b6c2d1}
.course-hero{border-radius:14px;padding:30px 34px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.course-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.course-hero::before{content:"";position:absolute;right:60px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.ch-row{display:flex;align-items:center;gap:20px;position:relative;z-index:1;flex-wrap:wrap}
.ch-icon{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-title{flex:1;min-width:220px}
.ch-title h1{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.5px}
.ch-title .en{font-size:13px;opacity:.75;margin-top:3px}
.ch-title .code{display:inline-block;margin-top:8px;font-size:11.5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:2px 10px;border-radius:12px;letter-spacing:1px}
.term-tabs{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.term-tab{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 18px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600;font-family:var(--sans);transition:all .15s}
.term-tab:hover{background:rgba(255,255,255,.22)}
.term-tab.active{background:#fff;color:var(--navy-900);border-color:#fff}
.course-body{display:grid;grid-template-columns:264px 1fr;gap:24px;margin:24px 0 40px;align-items:start}

/* week sidebar */
.week-side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:84px;overflow:hidden}
.ws-head{padding:14px 16px;border-bottom:1px solid var(--line-2);font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.ws-list{max-height:calc(100vh - 220px);overflow-y:auto;padding:8px}
.ws-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
.ws-item:hover{background:var(--navy-050)}
.ws-item.active{background:var(--navy-100);border-left-color:var(--gold)}
.ws-num{width:26px;height:26px;border-radius:50%;background:var(--navy-050);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-2);flex-shrink:0}
.ws-item.active .ws-num{background:var(--navy-800);color:#fff;border-color:var(--navy-800)}
.ws-item.done .ws-num{background:var(--green-bg);border-color:#bcdcc8;color:var(--green)}
.ws-info{flex:1;min-width:0}
.ws-info .t{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-info .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-check{width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0}

/* ===== 知识点树形目录（所有学科通用，仿文档目录条） ===== */
.ws-head{gap:6px}
.ws-head .ws-title{letter-spacing:1px;white-space:nowrap}
.ws-head .ws-term{font-weight:400;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
.kp-tools-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:3px 4px;border-radius:5px;flex-shrink:0}
.kp-tools-btn:hover{background:var(--navy-050);color:var(--navy-900)}
.kp-tools-btn.on{background:var(--navy-100);color:var(--navy-900)}
.kp-search-wrap{display:none;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.kp-search-wrap.show{display:block}
.kp-search-wrap input{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe;color:var(--ink);font-size:12.5px;outline:none;font-family:var(--sans)}
.kp-search-wrap input:focus{border-color:var(--gold);background:#fff}
.ws-arrow{width:15px;flex-shrink:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:10px;line-height:1;padding:2px 0;text-align:center;transition:transform .15s}
.ws-arrow:hover{color:var(--navy-900)}
.kp-list{display:none;margin:0 0 4px 24px;padding:1px 0 3px 9px;border-left:1px solid var(--line-2)}
.ws-group.open .kp-list{display:block}
.kp-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;border-left:2px solid transparent;background:transparent;padding:6px 8px;border-radius:0 6px 6px 0;cursor:pointer;color:var(--ink-2);font-size:12px;font-family:var(--sans);line-height:1.35}
.kp-item:hover{background:var(--navy-050)}
.kp-item.active{background:var(--navy-100);border-left-color:var(--gold);color:var(--navy-900);font-weight:700}
.kp-item.lv2{padding-left:19px;font-size:11.5px;color:var(--muted)}
.kp-item.lv2.active{color:var(--navy-900)}
.kp-ic{flex-shrink:0;font-size:9px;color:#8a6fd1;line-height:1}
.kp-item.lv2 .kp-ic{font-size:7px;color:#b9a9d6}
.kp-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-kp]{scroll-margin-top:96px}
.kb-flash{animation:kpFlash 1.5s ease}
@keyframes kpFlash{0%{background:transparent}18%{background:#fff3c9}65%{background:#fff9e6}100%{background:transparent}}
@media print{.week-side,.kp-tools-btn,.kp-search-wrap{display:none!important}}

/* week panel */
.week-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.wp-head{padding:24px 28px 20px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fbfcfe,#fff)}
.wp-week{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold-deep);margin-bottom:8px}
.wp-head h2{font-family:var(--serif);font-size:23px;color:var(--navy-900);line-height:1.35}
.wp-topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wp-sections{padding:8px 28px 28px}
.wp-sec{padding:20px 0;border-bottom:1px dashed var(--line)}
.wp-sec:last-child{border-bottom:none}
.wp-sec-t{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;color:var(--navy-900);margin-bottom:14px;font-family:var(--serif)}
.wp-sec-t .ic{width:26px;height:26px;border-radius:7px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wp-sec-t .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--sans)}
/* 本周任务：可折叠（默认折叠，只占小标题；点击展开） */
.wp-sec.collapsible .coll-body{display:none}
.wp-sec.collapsible.open .coll-body{display:block}
.wp-sec.collapsible .coll-head{cursor:pointer}
.wp-sec.collapsible .coll-head:hover{color:var(--navy-700)}
.wp-sec.collapsible .coll-arrow{margin-left:6px;transition:transform .18s ease;font-size:11px;color:var(--muted);flex-shrink:0}
.wp-sec.collapsible.open .coll-arrow{transform:rotate(90deg)}
/* ===== 复习导航（按艾宾浩斯间隔回看） ===== */
.rv-wrap{background:linear-gradient(180deg,#fbfdff,#f3f7fc);border:1px solid var(--line-2);border-left:3px solid var(--navy-700);border-radius:12px;padding:14px 16px 15px;margin:0 0 14px}
.rv-lead{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin:0 0 12px}
.rv-lead b{color:var(--navy-800)}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}
.rv-card{display:flex;flex-direction:column;gap:5px;text-decoration:none!important;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;color:var(--ink)!important;transition:.15s;min-height:118px}
.rv-card:hover{border-color:var(--navy-700);box-shadow:0 4px 14px rgba(19,49,92,.10);transform:translateY(-1px)}
.rv-when{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.3px;color:#8a6d1f;background:#fdf6e3;border:1px solid #f0e2bb;border-radius:999px;padding:2px 8px}
.rv-tt{font-size:13.5px;font-weight:800;color:var(--navy-900);line-height:1.35}
.rv-do{font-size:11.8px;color:var(--ink-2);line-height:1.55}
.rv-go{margin-top:auto;padding-top:4px;font-size:11px;font-weight:800;color:var(--navy-700)}
.rv-card.rv-wip{background:#fffdf8;border-style:dashed}
.rv-card.rv-wip .rv-when{color:#9a5b12;background:#fff3e6;border-color:#f3d9b8}
.rv-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-2)}
.rv-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:#fff;color:var(--navy-800)!important;font-family:var(--sans);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;text-decoration:none!important;transition:.15s}
.rv-link:hover{background:var(--navy-900);color:#fff!important;border-color:var(--navy-900)}
@media(max-width:640px){.rv-grid{grid-template-columns:1fr}.rv-card{min-height:0}}
@media print{.rv-wrap{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Academic English 三段式：① 本周上课内容 ② 本周作业 ③ How to Improve ===== */
.eng-sec{background:linear-gradient(180deg,#fbfaff,#f5f8ff);border:1px solid var(--line-2);border-radius:14px;padding:18px 18px 20px;margin:14px 0;box-shadow:0 1px 0 rgba(20,40,80,.02)}
.eng-sec-t{font-size:16px;margin-bottom:14px}
.eng-sec-t .eng-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:14px;font-weight:800;font-family:var(--sans);margin-right:3px;flex-shrink:0}
.eng-class .eng-sec-t .eng-num{background:#2b6cb0}
.eng-homework .eng-sec-t .eng-num{background:#c05621}
.eng-howto .eng-sec-t .eng-num{background:#2f855a}
/* 本周作业内答案块 */
.eng-answers{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.eng-answers-t{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px;letter-spacing:.5px}
/* howto 内部样式 */
.howto{font-size:calc(10px * var(--rf));line-height:1.8;color:var(--ink-2)}
.howto-lead{margin:0 0 12px;font-size:calc(11px * var(--rf));color:var(--ink)}
.howto-lead b{color:var(--navy-800)}
.howto-item{background:#fff;border:1px solid var(--line-2);border-left:3px solid #2f855a;border-radius:10px;padding:12px 15px;margin:10px 0}
.howto-h{font-size:calc(11.5px * var(--rf));font-weight:800;color:var(--navy-800);margin-bottom:6px}
.howto-item p{margin:4px 0;font-size:calc(10.5px * var(--rf));line-height:1.75}
.howto-ul{margin:4px 0 4px 20px}
.howto-ul li{margin:4px 0;font-size:calc(10.5px * var(--rf))}

/* notes */
.notes{font-size:calc(10px * var(--rf));line-height:1.85;color:var(--ink-2)}
.notes h4{font-size:calc(14px * var(--rf));color:var(--navy-800);margin:18px 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.notes h4:first-child{margin-top:0}
.notes h4::before{content:"";width:4px;height:15px;background:var(--gold);border-radius:2px;flex-shrink:0}
.notes p{margin:8px 0}
.notes ul,.notes ol{margin:8px 0 8px 20px}
.notes li{margin:4px 0}
.notes strong{color:var(--navy-800)}
.notes code{background:var(--navy-050);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;font-size:calc(10px * var(--rf));font-family:Consolas,Menlo,monospace;color:var(--navy-800)}
.notes .en-term{color:var(--blue);font-weight:600}
.notes table{border-collapse:collapse;width:100%;margin:10px 0;font-size:calc(10px * var(--rf))}
.notes th{background:var(--navy-050);border:1px solid var(--line);padding:6px 10px;text-align:left;color:var(--navy-800);font-weight:700}
.notes td{border:1px solid var(--line);padding:6px 10px}
.notes blockquote{border-left:3px solid var(--gold);background:#fdfaf2;padding:10px 14px;margin:10px 0;border-radius:0 6px 6px 0;font-size:calc(11px * var(--rf));color:var(--ink-2)}
.prep-q{background:var(--blue-bg);border:1px solid #c9dbf2;border-radius:8px;padding:14px 16px;margin-top:4px}
.prep-q .pq-t{font-size:calc(10px * var(--rf));font-weight:700;color:var(--blue);letter-spacing:1.5px;margin-bottom:8px}
.prep-q ol{margin-left:18px}
.prep-q li{font-size:calc(11px * var(--rf));color:var(--ink-2);margin:5px 0}

/* ===== 图文笔记（按总规范：黑/红/蓝三色 + 双语 + 图表 + 公式） ===== */
.note-tabs{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.note-tab{background:#fff;border:1px solid var(--line-2);color:var(--muted);padding:7px 16px;border-radius:18px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .15s;display:inline-flex;align-items:center;gap:7px}
/* 笔记区顶部信息条 */
.note-info-bar{background:linear-gradient(135deg,#f4f8fd,#eef3f9);border:1px solid var(--line-2);border-left:3px solid var(--navy-900);border-radius:10px;padding:12px 16px;margin:6px 0 14px;display:flex;flex-direction:column;gap:5px}
.note-info-bar .ni-l1{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
.note-info-bar .ni-l1 .dot{opacity:.5;margin:0 2px}
.note-info-bar .ni-l1 .hl{color:var(--navy-900)}
.note-info-bar .ni-l2{font-size:calc(14px * var(--rf));font-weight:800;color:var(--navy-800)}
.note-info-bar .ni-l3{font-size:11.5px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.note-tab:hover{border-color:#c3d2e4;color:var(--ink-2)}
.note-tab.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.note-tab .cnt{font-size:10.5px;font-weight:600;opacity:.7;background:rgba(0,0,0,.06);padding:1px 7px;border-radius:9px}
.note-tab.active .cnt{background:rgba(255,255,255,.18);opacity:.9}
.note-pane{display:none}
.book-reading-page{max-width:1160px;margin:0 auto;padding:clamp(16px,2vw,28px);background:#fffcf4;border:1px solid var(--line-2);border-radius:12px;color:#302a23;font-family:Georgia,"Noto Serif SC","SimSun",serif;line-height:1.9;overflow-wrap:anywhere}
#book-chapter-start{scroll-margin-top:110px}
/* 行内标注（雅思式：高亮与笔记直接贴在正文里，不堆在底部） */
.book-original-text mark{background:#ffe18a;color:inherit;cursor:pointer;border-radius:2px;padding:0 1px}
.book-original-text mark.hl-note{background:#bfe3c6;box-shadow:inset 0 -2px 0 #2e9e5b}
.book-original-text mark.hl-note::after{content:"\1F4DD";font-size:.7em;margin-left:1px;vertical-align:.1em}
.hl-toolbar{position:fixed;z-index:70;display:none;gap:6px;background:#0d2440;padding:6px;border-radius:10px;box-shadow:0 10px 30px rgba(13,27,62,.4)}
.hl-toolbar button{background:#173a6b;color:#fff;border:0;border-radius:7px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.hl-toolbar button.ask{background:var(--gold);color:#1a1300}
.hl-toolbar button:hover{filter:brightness(1.12)}
.hl-pop{position:fixed;z-index:71;display:none;width:min(320px,90vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 48px rgba(13,27,62,.35);padding:12px}
.hl-pop h5{margin:0 0 8px;font-size:13px;color:var(--navy-900)}
.hl-pop textarea{width:100%;min-height:70px;resize:vertical;border:1.5px solid var(--line-2);border-radius:8px;padding:8px;font-size:13px;font-family:var(--sans);outline:none}
.hl-pop textarea:focus{border-color:#b8912f}
.hl-pop .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hl-pop .row button{border:0;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.hl-pop .save{background:var(--navy-900);color:#fff}
.hl-pop .del{background:#fdecec;color:#c0392b}
.hl-pop .cancel{background:#eef2f9;color:var(--ink)}
.hl-pop .note-text{font-size:13px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;max-height:200px;overflow:auto}
.reading-language{display:block;padding:8px 3px;font-size:13px}.reading-language select{display:block;width:100%;margin-top:5px;padding:6px 2px;border:1px solid #d4caba;border-radius:6px;background:var(--paper,#f8f3e8);color:inherit}.novel-tools .reading-language{width:76px;margin-left:-9px}
.book-check-wrap{min-width:0}.book-done-label{display:flex;align-items:center;gap:7px;margin:8px 0 16px;font-size:14px;cursor:pointer}.book-done-label input{width:18px;height:18px;accent-color:#244a70}
.book-original-text mark{background:#ffe18a;color:inherit}
.pdf-toolbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#fffcf4;border:0;margin:0;padding:10px 0}
.pdf-toolbar input{width:4.5em}
body.cabin-pdf-focus .site-footer{display:none}
.cabin-pdf-focus .pdf-reading-shell{max-width:none;padding:0 12px 12px}
.cabin-pdf-focus .pdf-reading-shell > .book-reading-nav{max-width:none;margin:8px 0;justify-content:flex-start;gap:8px}
.cabin-pdf-focus .book-reading-page{max-width:none;padding:10px 12px;background:#f5f7fa}
.cabin-pdf-focus .book-reading-page h2{margin:0 0 4px;font-size:16px}
.cabin-pdf-focus .book-reading-caption{display:none}
.cabin-pdf-focus .pdf-toolbar{background:#f5f7fa;padding:5px 0 8px}
.cabin-pdf-focus .pdf-paper{height:calc(100dvh - 235px);min-height:320px;max-height:none;padding:10px;background:#e5e9ef;border-radius:8px}
.cabin-pdf-focus .book-annotations{position:static;background:transparent}
.pdf-reader-links{display:flex;justify-content:flex-end;margin:4px 0}
.pdf-paper{background:#e9edf2;max-height:76vh;overflow:auto;padding:12px}
.pdf-paper canvas{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 10px #162e4526}
.book-reading-page h2{line-height:1.4}
.book-original-text{white-space:pre-wrap;font-size:calc(14px * var(--rf));line-height:1.85}
.book-reading-caption{font-size:.85em;color:#675849}
.novel-focus{background:#ebe6db}
.novel-focus .site-footer{display:none}
.novel-shell{--paper:#f8f3e8;--ink:#2a251f;max-width:1120px;margin:0 auto;padding:0 84px 28px 20px}
.novel-shell .book-reading-page{max-width:none;margin:0;padding:clamp(24px,5vw,70px);border:0;border-radius:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
.novel-shell .book-reading-page h2{font-size:clamp(24px,3vw,36px);font-weight:600;margin:0 0 26px}
.novel-shell .book-original-text{font-size:calc(18px * var(--rf));line-height:2;color:var(--ink);overflow-wrap:anywhere}
.novel-shell .book-reading-caption{color:#756c61}
.novel-shell .book-annotations{background:var(--paper)}
.novel-shell .book-reading-nav{max-width:none;margin:0;padding:10px 0}
.novel-tools{position:sticky;top:84px;float:right;width:58px;margin-right:-70px;display:grid;gap:8px;z-index:2}
.novel-tools a,.novel-tools button,.novel-tools summary{display:block;width:100%;border:0;border-radius:9px;padding:10px 3px;background:var(--paper);color:var(--ink);text-align:center;font:inherit;cursor:pointer;text-decoration:none}
.novel-tools details[open]{width:66px} .novel-directory{position:relative}.novel-directory div{position:absolute;right:100%;top:0;width:min(300px,72vw);max-height:65vh;overflow:auto;padding:8px;background:var(--paper);border:1px solid #ded2bb;box-shadow:0 4px 16px #2a251f18}.novel-directory div a{text-align:left;padding:7px}.novel-directory [aria-current]{background:#ded2bb}@media(max-width:650px){.novel-directory div{right:auto;left:0;top:100%}}
.novel-tools [aria-pressed="true"]{background:#ded2bb}
.novel-tools a:focus-visible,.novel-tools button:focus-visible,.novel-tools summary:focus-visible{outline:2px solid currentColor}
@media(max-width:650px){
  .novel-shell{padding:0 8px 18px}
  .novel-tools{float:none;width:auto;margin:0;top:76px;display:flex;align-items:start;background:#ebe6db;padding:6px;flex-wrap:wrap}
  .novel-tools a,.novel-tools button,.novel-tools summary{width:auto;padding:7px 9px}
}
.book-reading-nav{max-width:1160px;margin:14px auto;display:flex;justify-content:space-between;gap:12px}
.note-pane.active{display:block}
/* 笔记导出按钮（PDF / Word） */
.note-exp{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.ne-btn{border:1px solid var(--line-2);background:#fff;color:var(--navy-800);font-family:var(--sans);font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;cursor:pointer;transition:.15s}
.ne-btn:hover{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}

.gx{font-size:calc(10px * var(--rf));line-height:1.75;color:var(--ink)}
.gx h3.gx-h{font-size:calc(14px * var(--rf));color:var(--navy-900);margin:22px 0 10px;padding-left:12px;border-left:4px solid var(--gold);font-weight:800;letter-spacing:.3px}
.gx h3.gx-h:first-child{margin-top:4px}
/* 活动页签导航（数据驱动：每周按真实 Activity 数量自动生成页签） */
.act-nav{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 16px;padding:11px 13px;background:linear-gradient(180deg,#fbf7ec,#f5eeda);border:1px solid var(--gold);border-radius:12px}
.act-nav-t{width:100%;font-size:12px;font-weight:800;color:var(--navy-800);letter-spacing:.6px;margin-bottom:3px}
.act-chip{border:1px solid var(--navy-800);background:#fff;color:var(--navy-900);font-family:var(--sans);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.act-chip:hover{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.act-chip:active{transform:translateY(1px)}
.act-hl{animation:actFlash 1.3s ease}
@keyframes actFlash{0%{background:rgba(201,162,39,.38)}100%{background:transparent}}
.gx h3.gx-h.act-target{scroll-margin-top:14px}
@media print{.act-nav{display:none}}
.gx p{margin:8px 0}
.gx ul{margin:8px 0 8px 20px}
.gx ul li{margin:5px 0}
.gx .c-red{color:#c0392b;font-weight:700}
.gx .c-blue{color:#1f6fb2;font-weight:600}
.gx .c-ink{color:var(--ink)}
.gx .c-gold{color:#b8860b;font-weight:700}
/* 双语定义块 */
.gx-def{display:flex;flex-direction:column;gap:2px;padding:10px 14px;background:var(--navy-050);border:1px solid var(--line-2);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin:8px 0}
.gx-def .en{font-weight:800;color:var(--navy-800);font-size:calc(11px * var(--rf))}
.gx-def .en::before{content:"EN · ";color:var(--blue);font-weight:700;font-size:calc(9px * var(--rf));letter-spacing:1px}
.gx-def .cn{color:var(--ink-2);font-size:calc(11px * var(--rf))}
/* 逐页精读块 */
.gx-pages{margin:8px 0}
.gx-page{margin:12px 0;padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;background:#fff}
.gx-page .gx-pg-h{font-size:calc(12px * var(--rf));font-weight:800;color:var(--navy-800);letter-spacing:.3px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.gx-page .gx-pg-b{font-size:calc(10px * var(--rf));color:var(--ink-2);line-height:1.7}
.gx-page.gx-example{background:#f5f9fc;border-left:3px solid var(--blue)}
.gx-page.gx-example .gx-pg-h{color:#1f6fb2}
.gx-defs{margin:8px 0}
.gx-tbl{border-collapse:collapse;width:100%;margin:10px 0;font-size:calc(10px * var(--rf))}
.gx-tbl th,.gx-tbl td{border:1px solid var(--line-2);padding:8px 10px;text-align:left;vertical-align:top}
.gx-tbl th{background:var(--navy-050);font-weight:800;color:var(--navy-800)}
.gx-exam h4{font-size:calc(12px * var(--rf));color:var(--navy-900);margin:12px 0 4px;font-weight:800}
.gx-exam ul{margin:4px 0 8px 20px}
.gx-exam li{margin:4px 0;font-size:calc(11px * var(--rf))}
/* 色块提示 */
.callout{border-radius:10px;padding:12px 16px;margin:12px 0;font-size:calc(11px * var(--rf));line-height:1.7;border:1px solid}
.callout .ct{font-weight:800;font-size:calc(10px * var(--rf));letter-spacing:1.2px;display:block;margin-bottom:5px}
.callout.red{background:#fdf0ee;border-color:#f0c4bc;color:#7a2418}
.callout.red .ct{color:#c0392b}
.callout.blue{background:var(--blue-bg);border-color:#c4d8f0;color:#15405f}
.callout.blue .ct{color:#1f6fb2}
.callout.def{background:var(--navy-050);border-color:var(--line-2);color:var(--ink-2)}
.callout.def .ct{color:var(--navy-800)}
.callout.gold{background:#fdfaf2;border-color:#ecd9a8;color:#6b531a}
.callout.gold .ct{color:#b8860b}
/* 公式块 */
.formula{background:#fbfdff;border:1px solid var(--line-2);border-radius:8px;padding:12px 16px;margin:10px 0;text-align:center;font-size:calc(12px * var(--rf));font-family:"Cambria Math","Times New Roman",Georgia,serif;color:var(--navy-900);overflow-x:auto}
.formula .lab{display:block;font-family:var(--sans);font-size:calc(9px * var(--rf));color:var(--muted);margin-top:6px;letter-spacing:.5px}
/* 竖式分数（无内联样式，避免引号） */
.gx .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px;font-size:.94em;line-height:1.05}
.gx .frac .n{border-bottom:1.5px solid currentColor;padding:0 5px}
.gx .frac .d{padding:0 5px}
/* 公式块内的横线分数（把 (A)/(B) 与 [...]÷[...] 渲染成分子在上、分母在下、中间横杠） */
.formula .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em;font-size:1em;line-height:1.12}
.formula .frac .n{border-bottom:1.4px solid currentColor;padding:0 .42em .04em;white-space:nowrap}
.formula .frac .d{padding:.04em .42em 0;white-space:nowrap}
/* 全局分数兜底：保证「知识点归纳 / 填空复习」等面板里的 .frac 也显示成分数（带横线），
   不再只在 .gx / .formula 内部才生效（之前面板外的分数只剩文字、分数线丢失，看起来像抄错公式） */
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .16em;font-size:.96em;line-height:1.12}
.frac>.n{border-bottom:1.4px solid currentColor;padding:0 .42em .04em;white-space:nowrap}
.frac>.d{padding:.04em .42em 0;white-space:nowrap}
/* 图表容器 */
.diagram{padding:12px;margin:12px 0;text-align:center}
.diagram svg{width:100%;height:auto;max-width:560px}
.diagram .cap{font-size:calc(10px * var(--rf));color:var(--muted);margin-top:8px;font-family:var(--sans)}
/* 对照表 */
.gx-t{border-collapse:collapse;width:100%;margin:10px 0;font-size:calc(10px * var(--rf))}
.gx-t caption{caption-side:top;text-align:left;font-weight:700;color:var(--navy-800);font-size:calc(10px * var(--rf));padding:4px 2px 8px;letter-spacing:.5px}
.gx-t th{background:var(--navy-900);color:#fff;padding:8px 11px;text-align:left;font-weight:700;font-size:calc(10px * var(--rf))}
.gx-t td{border:1px solid var(--line);padding:8px 11px;vertical-align:top}

/* AI 助手浮动面板 */
#ai-fab{position:fixed;right:22px;bottom:26px;z-index:60;width:52px;height:52px;border-radius:50%;background:var(--navy-900);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(13,27,62,.4);transition:transform .15s}
#ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;right:22px;bottom:88px;z-index:61;width:min(420px,92vw);min-width:300px;min-height:280px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 16px 48px rgba(13,27,62,.35);overflow:hidden;border:1px solid var(--line)}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--navy-900);color:#fff;font-weight:700;font-size:13px;cursor:move;user-select:none}
.ai-head button{background:none;border:0;color:#cdd6e8;font-size:14px;cursor:pointer}
.ai-head-btns{display:flex;gap:10px;align-items:center}
#ai-model{font-weight:600;color:var(--gold)}
.ai-in button:hover{background:var(--navy-700)}
.ai-in button.stopping{background:#9c2a2a}
.ai-resizer{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;z-index:3;background:linear-gradient(135deg,transparent 46%,rgba(13,27,62,.35) 46%,rgba(13,27,62,.35) 54%,transparent 54%,transparent 66%,rgba(13,27,62,.35) 66%,rgba(13,27,62,.35) 74%,transparent 74%);border-bottom-right-radius:14px}
#ai-fab.ai-busy::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.ai-log .a.streaming::after{content:"▌";animation:blink .9s steps(1) infinite;color:var(--navy-700)}
@keyframes blink{50%{opacity:0}}
.ai-hint{padding:8px 14px;font-size:11.5px;color:var(--muted);background:#f5f8fc;border-bottom:1px solid var(--line)}
.ai-log{flex:1;overflow-y:auto;padding:10px 14px;font-size:13px;line-height:1.65;min-height:80px}
.ai-log .msg{margin:8px 0;padding:9px 12px;border-radius:9px;max-width:94%;word-break:break-word}
.ai-log .q{background:#eef2f9;color:var(--ink);margin-left:auto;border:1px solid #dfe6f2}
.ai-log .a{background:#fff;border:1px solid var(--line)}
.ai-log .err{background:#fdecec;color:#c0392b;border:1px solid #f5c6c6}
.ai-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fafbfd}
.ai-in textarea{flex:1;resize:none;border:1.5px solid var(--line-2);border-radius:8px;padding:8px;font-size:13px;font-family:var(--sans);outline:none}
.ai-in textarea:focus{border-color:#b8912f}
.ai-in button{background:var(--navy-900);color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--sans)}
.gx-t tr:nth-child(even) td{background:var(--navy-050)}
.gx-t .hl{color:#c0392b;font-weight:700}
.gx-t .ok{color:#1f6fb2;font-weight:700}
/* 考试三层次标签 */
.gx-flags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.gx-flag{font-size:calc(10px * var(--rf));font-weight:700;padding:4px 12px;border-radius:14px}
.gx-flag.remember{background:#fdf0ee;color:#c0392b;border:1px solid #f0c4bc}
.gx-flag.understand{background:#fdfaf2;color:#b8860b;border:1px solid #ecd9a8}
.gx-flag.practice{background:var(--blue-bg);color:#1f6fb2;border:1px solid #c4d8f0}
/* 例题步骤 */
.gx-step{display:flex;gap:10px;margin:6px 0;align-items:flex-start}
.gx-step .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.gx-step .b{font-size:calc(11px * var(--rf));color:var(--ink-2)}
/* 补充讲解标签：不加粗、浅色斜体，与官方粗体文字区分 */
.sup{color:#8a97ad;font-style:italic;font-weight:400}
strong,.gx b,.notes b{font-weight:700}
/* PPT 例题面板 */
.examples .gx-example{background:#fafcff;border-radius:10px;padding:14px 18px;margin:10px 0;font-size:calc(11px * var(--rf));line-height:1.65}
.examples .gx-example p{margin:4px 0}
.examples h4{font-size:calc(14px * var(--rf));font-weight:800;color:var(--navy-800);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-2)}
/* 课后作业答案面板 */
.answers .gx-answer{background:#fafcff;border-radius:10px;padding:14px 18px;margin:10px 0;font-size:calc(11px * var(--rf));line-height:1.65}
.answers .gx-answer ul{margin:6px 0;padding-left:20px}
.answers h4{font-size:calc(14px * var(--rf));font-weight:800;color:var(--navy-800);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-2)}

/* glossary */
.glossary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-item{display:flex;flex-wrap:wrap;gap:4px 10px;padding:9px 12px;background:var(--navy-050);border:1px solid var(--line-2);border-radius:8px;font-size:calc(10px * var(--rf))}
.g-item .en{font-weight:700;color:var(--navy-800);min-width:0}
.g-item .cn{color:var(--ink-2)}
.g-item .cn::before{content:"";display:inline-block;width:1px;height:11px;background:#c3cede;margin-right:8px;vertical-align:-1px}
.g-item .gdef{flex-basis:100%;font-size:calc(10px * var(--rf));line-height:1.55;color:#5a6b8c;margin-top:2px}
.g-item .gdef::before{content:"";display:inline-block;width:1px;height:10px;background:#d8a24a;margin:0 8px 0 2px;vertical-align:-1px}
.g-item .gdef-src{font-size:11px;color:var(--muted);font-style:italic}

/* files */
.file-group{margin-bottom:16px}
.fg-head{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fg-head::after{content:"";flex:1;height:1px;background:var(--line-2)}
.file-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:6px;background:#fff;transition:all .13s}
.file-row:hover{border-color:#c3d2e4;background:var(--navy-050)}
.f-ext{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:.5px}
.f-main{flex:1;min-width:0}
.f-name{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4;word-break:break-all}
.f-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.f-open{font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap;padding:5px 12px;border:1px solid var(--line);border-radius:16px;background:#fff}
.f-open:hover{background:var(--blue-bg);border-color:#bcd4ef;text-decoration:none}
.empty-hint{font-size:13px;color:var(--muted);background:var(--navy-050);border:1px dashed var(--line);border-radius:8px;padding:14px 16px}

/* tasks */
.task-row{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:7px;background:#fff;transition:all .13s}
.task-row:hover{border-color:#c3d2e4}
.task-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.task-row .t-body{flex:1}
.task-row .t-text{font-size:13.5px;color:var(--ink);line-height:1.55}
.task-row.done .t-text{color:var(--muted);text-decoration:line-through}
.t-type{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.5px;flex-shrink:0;margin-top:2px}
.t-type.preview{background:var(--blue-bg);color:var(--blue)}
.t-type.homework{background:var(--amber-bg);color:var(--amber)}
.t-type.review{background:var(--green-bg);color:var(--green)}
.task-progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.task-progress .bar{flex:1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.task-progress .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.task-progress .txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* mark done button */
.mark-done{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);color:var(--green);border:1px solid #bcdcc8;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.mark-done:hover{background:#d9ecdf}
.mark-done.is-done{background:var(--green);color:#fff;border-color:var(--green)}

/* ============ assistant page ============ */
.assist-hero{background:linear-gradient(135deg,#173a2c 0%,#1f5c41 60%,#2a7a54 100%);color:#fff;border-radius:14px;padding:40px 36px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.assist-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.assist-hero h1{font-family:var(--serif);font-size:30px;margin-bottom:12px}
.assist-hero p{color:#cfe4d6;max-width:640px;font-size:14.5px;line-height:1.8}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);position:relative}
.step .no{position:absolute;top:-15px;left:20px;width:32px;height:32px;border-radius:50%;background:var(--navy-900);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:15px;border:2px solid var(--gold)}
.step h4{font-size:16px;color:var(--navy-900);margin:10px 0 8px;font-family:var(--serif)}
.step p{font-size:13px;color:var(--ink-2);line-height:1.7}
.step{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.step:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#c3d2e4}
.step:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.step .chev{position:absolute;top:24px;right:18px;color:var(--muted);font-size:13px;transition:transform .2s}
.step.open .chev{transform:rotate(180deg)}
.step-hint{margin-top:10px;font-size:12px;color:var(--blue);font-weight:600}
.step-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);text-align:left}
.step.open .step-detail{display:block;animation:fadeIn .25s ease}
.step-detail h5{font-size:13px;color:var(--navy-900);margin:10px 0 6px}
.step-detail ul{margin-left:18px;font-size:13px;color:var(--ink-2)}
.step-detail li{margin:3px 0}
.step-detail .demo{background:var(--navy-050);border:1px solid var(--line-2);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-top:8px}
.step-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.copy-btn{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--navy-800);cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.copy-btn:hover{background:var(--blue-bg);border-color:#bcd4ef}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
.scroll-link{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 4px;font-family:var(--sans)}
.scroll-link:hover{text-decoration:underline}

/* ============ 提交工作台 ============ */
.sub-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:22px}
.sub-head{font-family:var(--serif);font-size:17px;color:var(--navy-900);margin-bottom:4px}
.sub-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.sub-grid label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sub-grid select,.sub-grid input{width:100%;padding:9px 11px;border:1.5px solid var(--line-2);border-radius:8px;font-size:13.5px;font-family:var(--sans);color:var(--ink);background:#fff;outline:none}
.sub-grid select:focus,.sub-grid input:focus{border-color:#b8912f}
.dropzone{border:2px dashed #c3d2e4;border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:12px}
.dropzone:hover,.dropzone.drag{border-color:#b8912f;background:#fffaf0}
.dz-main{font-size:14px;font-weight:600;color:var(--navy-900);margin-bottom:4px}
.dz-hint{font-size:12px;color:var(--muted)}
.dz-file{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid #bcd4ef;color:var(--navy-800);border-radius:8px;padding:5px 10px;margin:3px 3px 0;font-size:12.5px;font-weight:600}
.dz-file i{font-style:normal;color:var(--muted);cursor:pointer;font-size:14px}
.sub-textbox{width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:8px;font-size:13.5px;font-family:var(--sans);color:var(--ink);background:#fff;outline:none;resize:vertical;min-height:80px}
.sub-textbox:focus{border-color:#b8912f}
.sub-text-hint{font-size:12px;color:var(--muted);margin:8px 0 12px}
.sub-result{display:none;margin-top:16px;padding:16px;border-radius:10px;background:#f5f8fc;border:1px solid #dfe6f2}
.sub-result.show{display:block;animation:fadeIn .3s ease}
.sr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sr-head b{font-size:15px;color:var(--navy-900)}
.sr-score{font-family:var(--serif);font-size:20px;color:var(--gold)}
.sr-score small{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:500;margin-left:4px}
.sr-body{font-size:13.5px;line-height:1.75;color:var(--ink);margin-bottom:10px}
.sr-weak{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sr-weak .tag{background:#fdecec;color:#c0392b;border:1px solid #f5c6c6;font-size:11.5px;padding:2px 9px;border-radius:9px}
.sr-foot{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.sr-foot button{background:var(--navy-900);color:#fff;border:0;border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.sub-submit{display:flex;align-items:center;gap:12px;margin-top:14px}
.sub-submit .btn{padding:10px 24px;font-size:14px}
.sub-submit .btn:disabled{opacity:.55;cursor:not-allowed}
.sub-note{font-size:11.5px;color:var(--muted);line-height:1.6}

.tpl-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-top:22px}
.tpl-box h4{font-size:16px;color:var(--navy-900);font-family:var(--serif);margin-bottom:14px}
.tpl-item{border-left:3px solid var(--gold);background:var(--navy-050);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:13px;color:var(--ink-2);line-height:1.7;display:flex;align-items:center;gap:12px}
.tpl-item .tpl-text{flex:1;min-width:0}
.tpl-item b{color:var(--navy-800)}
.assess-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13px;margin-top:8px}
.assess-table th{background:var(--navy-900);color:#fff;padding:11px 14px;text-align:left;font-size:12.5px;letter-spacing:.5px}
.assess-table td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.assess-table tr:last-child td{border-bottom:none}
.assess-table tr:hover td{background:var(--navy-050)}
.a-course{font-weight:700;color:var(--navy-800);white-space:nowrap}
.a-course .cc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

/* ============ profile (learning archive) ============ */
.prof-hero{background:linear-gradient(135deg,#3a2a52 0%,#5a3e7e 60%,#7a5ba0 100%);color:#fff;border-radius:14px;padding:36px;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.prof-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
.prof-hero h1{font-family:var(--serif);font-size:28px;margin-bottom:12px}
.prof-hero p{color:#ddd2ec;max-width:680px;font-size:14px;line-height:1.8}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.pf-stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px;box-shadow:var(--shadow);text-align:center}
.pf-stat .num{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--navy-900)}
.pf-stat .num span{font-size:14px;color:var(--gold-deep)}
.pf-stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:1px}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.pf-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.pf-card h3{font-family:var(--serif);font-size:16px;color:var(--navy-900);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pf-card .pf-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.wp-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;cursor:pointer}
.wp-row:hover .wp-name{color:var(--blue)}
.wp-row .wp-name{width:190px;flex-shrink:0;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp-row .wp-bar{flex:1;height:14px;background:var(--line-2);border-radius:3px;overflow:hidden}
.wp-row .wp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:3px}
.wp-row .wp-count{font-size:12px;color:var(--muted);width:52px;text-align:right;flex-shrink:0}
.wp-active{background:var(--gold-light);border-radius:6px;padding:2px 4px}
.cs-row{margin-bottom:14px}
.cs-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.cs-head .cname{font-weight:700;color:var(--navy-800)}
.cs-head .cavg{color:var(--ink-2)}
.cs-bar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.cs-bar i{display:block;height:100%;border-radius:4px}
.cs-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.rec-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500;font-family:var(--sans)}
.filter-chip:hover{border-color:#bcd4ef;background:var(--blue-bg)}
.filter-chip.active{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.rec-table-wrap{overflow-x:auto}
.rec-table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.rec-table th{background:var(--navy-900);color:#fff;padding:10px 12px;text-align:left;font-size:12px;letter-spacing:.5px;font-weight:600}
.rec-table td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.rec-table tr:hover td{background:var(--navy-050)}
.rec-course{font-weight:700;white-space:nowrap}
.rec-course .cc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.rec-score{font-weight:700;font-family:var(--serif);font-size:15px}
.rec-score.good{color:var(--green)}
.rec-score.mid{color:var(--amber)}
.rec-score.low{color:var(--red)}
.rec-title{font-weight:600;color:var(--ink)}
.rec-date{color:var(--muted);white-space:nowrap;font-size:12.5px}
.rec-wp{max-width:260px}
.tag{display:inline-block;background:var(--gold-light);color:var(--amber);border:1px solid #ead9ac;font-size:11.5px;padding:2px 8px;border-radius:10px;margin:1px 4px 1px 0;cursor:pointer;font-weight:500}
.tag:hover{background:#f0e0b8}
.tag.on{background:var(--amber);color:#fff;border-color:var(--amber)}
.rec-del{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--red);font-family:var(--sans);font-weight:600;white-space:nowrap}
.rec-del:hover{background:var(--red-bg);border-color:#e5bcbc}
.rec-del.armed{background:var(--red);color:#fff;border-color:var(--red)}
.rec-form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rec-form .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.rec-form .fld.span2{grid-column:span 2}
.rec-form label{font-size:12px;color:var(--muted);font-weight:600}
.rec-form input,.rec-form select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink);width:100%}
.rec-form input:focus,.rec-form select:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(29,67,104,.08)}
.btn-navy{background:var(--navy-800);color:#fff;border:none}
.btn-navy:hover{background:var(--navy-700);text-decoration:none}
.btn-outline{background:#fff;color:var(--navy-800);border:1px solid var(--line)}
.btn-outline:hover{background:var(--navy-050);text-decoration:none}
.btn-danger{background:#fff;color:var(--red);border:1px solid #e5bcbc}
.btn-danger:hover{background:var(--red-bg);text-decoration:none}
.btn-danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.empty-rec{text-align:center;padding:34px 20px;color:var(--muted);font-size:13.5px;background:var(--navy-050);border:1px dashed var(--line);border-radius:8px;line-height:1.8}
.trend-svg{width:100%;height:auto;display:block}
.trend-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:6px}
.trend-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ============ footer ============ */
.site-footer{background:var(--navy-900);color:#9db1c9;margin-top:56px}

@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .25s ease}

@media (max-width:960px){
  .hero-inner{flex-direction:column;padding:40px 24px}
  .hero-right{max-width:100%;width:100%}
  .course-body{grid-template-columns:1fr}
  .week-side{position:static}

<script>
(function(){
"use strict";
var DATA = window.PORTAL_DATA;
var economicsSupplementWeeks = new Set();
if(DATA && DATA.courses){
  var economics = DATA.courses.find(function(course){ return course.id === "economics"; });
  var termOne = economics && economics.terms.find(function(term){ return term.id === "term1"; });
  var supplement = economics && economics.terms.find(function(term){ return term.id === "term1x"; });
  if(termOne && supplement){
    var existingUnits = new Set(termOne.weeks.flatMap(function(week){
      return Array.from(week.title.matchAll(/\bUnit\s+(\d+)/gi), function(match){ return Number(match[1]); });
    }));
    supplement.weeks.forEach(function(week){
      var unit = /^Unit\s+(\d+)/i.exec(week.title);
      if(unit && existingUnits.has(Number(unit[1]))) return;
      if(termOne.weeks.some(function(current){ return current.num === week.num; })) return;
      termOne.weeks.push(week);
      economicsSupplementWeeks.add(week.num);
    });
    termOne.weeks.sort(function(a,b){ return a.num - b.num; });
    economics.terms = economics.terms.filter(function(term){ return term !== supplement; });
  }
}
var app = document.getElementById("app");
var LS_KEY = "xinnan-portal-v1";

/* ---------- state ---------- */
/* 双通道持久化：localStorage（本机主通道，双击打开文件时永久保留）
   + progress.js（文件通道，跨打开来源同步，由助手更新） */
var storageOK = (function(){
  try{ localStorage.setItem("__xinnan_probe__","1"); localStorage.removeItem("__xinnan_probe__"); return true; }
  catch(e){ return false; }
})();
function loadState(){
  var base = {tasks:{},weeks:{},lastpos:{}};
  try{
    var fp = window.PORTAL_PROGRESS;
    if(fp){ base.weeks = fp.weeks || {}; base.tasks = fp.tasks || {}; }
  }catch(e){}
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var ls = JSON.parse(raw) || {};
      var w = ls.weeks || {}, t = ls.tasks || {}, k;
      for(k in w) base.weeks[k] = w[k];
      for(k in t) base.tasks[k] = t[k];
      if(ls.lastpos){ var lp; for(lp in ls.lastpos) base.lastpos[lp] = ls.lastpos[lp]; }
    }
  }catch(e){}
  return base;
}
var saveToastTimer = null;
function flashSave(ok){
  var el = document.getElementById("saveToast");
  if(!el){
    el = document.createElement("div");
    el.id = "saveToast";
    el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a2b4a;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:9999;box-shadow:0 4px 16px rgba(20,40,80,.28);opacity:0;transition:opacity .2s;pointer-events:none;font-family:var(--sans)";
    document.body.appendChild(el);
  }
  var d = new Date();
  var hh = ("0"+d.getHours()).slice(-2), mm = ("0"+d.getMinutes()).slice(-2), ss = ("0"+d.getSeconds()).slice(-2);
  el.textContent = ok ? ("✓ 进度已保存 " + hh + ":" + mm + ":" + ss) : "⚠ 当前环境无法写入本机存储";
  el.style.opacity = "1";
  if(saveToastTimer) clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(function(){ el.style.opacity = "0"; }, 2200);
}
var warnShown = false;
function showStorageWarn(){
  if(warnShown) return; warnShown = true;

function asList(v){ if(v==null) return []; if(Array.isArray(v)) return v; if(typeof v==="string"){ return v.split(/[；;]/).map(function(s){return s.trim();}).filter(Boolean); } return []; }

function weekTaskStats(course, term, week){

  (week.tasks||[]).forEach(function(t,i){

  return {done:done, total:total};
}
function firstIncompleteWeek(course){
  for(var i=0;i<course.terms.length;i++){
    var t = course.terms[i];
    for(var j=0;j<t.weeks.length;j++){
      var w = t.weeks[j];
      if(!state.weeks[weekKey(course.id, t.id, w.num)]) return {termId:t.id, num:w.num};
    }
  }
  var lt = course.terms[course.terms.length-1];
  var lw = lt && lt.weeks[lt.weeks.length-1];
  return {termId: lt ? lt.id : null, num: lw ? lw.num : 1};
}

var searchIndex = [];
function buildSearchIndex(){
  searchIndex = [];
  DATA.courses.forEach(function(c){
    var up = c.extra ? "M" : (c.reading ? "C" : "W");
    var uw = c.extra ? "个模块" : (c.reading ? "章" : "周");

    searchIndex.push({type:"course", title:c.nameCn, sub:c.name + " · " + cw + " " + uw, href:"#/c/"+c.id});
    c.terms.forEach(function(t){
      t.weeks.forEach(function(w){

        noteText.innerHTML = ((w.notesHtml || "") + " " + (w.graphicHtml || "")).replace(/<[^>]+>/g, " ");
        var plain = noteText.value.replace(/\s+/g, " ").trim();
        searchIndex.push({type:"week", title:up+w.num+" · "+w.title, sub:c.nameCn + (c.terms.length>1 ? " · "+t.name : ""), href:"#/c/"+c.id+"/"+t.id+"/"+w.num, text:(w.topics||[]).join(" ")+" "+plain});
      });

function doSearch(q){
  q = q.trim().toLowerCase();
  var box = document.getElementById("searchResults");
  if(!q){ box.className = "search-results"; box.innerHTML = ""; return; }
  var hits = [];
  for(var i=0;i<searchIndex.length;i++){
    var it = searchIndex[i];
    var hay = (it.title + " " + (it.sub||"") + " " + (it.text||"")).toLowerCase();
    if(hay.indexOf(q) !== -1){
      hits.push(it);
      if(hits.length >= 12) break;
    }
  }
  var html = "";
  if(!hits.length){ html = '<div class="sr-empty">没有找到「'+esc(q)+'」相关内容</div>'; }
  else{
    var lastType = "";
    hits.forEach(function(h){
      if(h.type !== lastType){
        html += '<div class="sr-group">' + (h.type==="course" ? "课程" : "周次 · 知识点") + '</div>';
        lastType = h.type;
      }
      html += '<a class="sr-item" href="'+h.href+'"><div class="sr-t">'+esc(h.title)+'</div><div class="sr-s">'+esc(h.sub||"")+'</div></a>';
    });
  }
  box.innerHTML = html;
  box.className = "search-results open";
}

function renderHomeTaskBoards(courses){
  var today = ppTodayStr();
  var days = (window.PREP_DATA && window.PREP_DATA.days) || [];
  var lastDay = days.length ? days[days.length-1].date : today;
  var todayTasks = [];
  days.forEach(function(day){
    day.items.forEach(function(item, index){
      var key = item.id || day.date + "#" + index;
      var effective = ppShift(day.date, PP.postpone[key] || 0);
      if(effective > lastDay) effective = lastDay;
      if(effective === today) todayTasks.push({ key:key, label:item.label+" · "+item.minutes+" 分钟", href:item.href });
    });
  });

  var weekday = new Date(today+"T12:00:00").getDay();
  var monday = ppShift(today, -((weekday+6)%7));
  var sunday = ppShift(monday, 6);
  var weeklyKey = "cabin-homework-" + monday;
  var completed = {};
  try { completed = JSON.parse(localStorage.getItem(weeklyKey) || "{}") || {}; } catch(e) {}

     当前单元存 localStorage，首页可随时改；经济学默认 5（用户确认学到 Unit 5 → 预习 Unit 6）。 */
  var PREVIEW_WORD = { economics:"Unit", accounting:"Unit", mathematics:"周", computing:"周", english:"周" };
  function getCurUnit(cid){
    var v = null;
    try { v = localStorage.getItem("cabin-curunit-"+cid); } catch(e){}
    if(v!==null && !isNaN(parseInt(v,10))) return Math.max(1, parseInt(v,10));
    return cid==="economics" ? 5 : 4;
  }
  function setCurUnit(cid, n){ try { localStorage.setItem("cabin-curunit-"+cid, n); } catch(e){} }
  var previewItems = courses.map(function(course){
    var w = PREVIEW_WORD[course.id] || "Unit";
    var cur = getCurUnit(course.id);
    return { cid:course.id, key:"preview-"+course.id, word:w, cur:cur, next:cur+1,
             label:((w==="周"?"预习 第"+(cur+1)+"周":"预习 "+w+" "+(cur+1))+"（"+(names[course.id]||course.nameCn)+"）"),
             href:"#/c/"+course.id };
  });
  var previewKey = "cabin-preview-" + monday;
  var previewDone = {};
  try { previewDone = JSON.parse(localStorage.getItem(previewKey) || "{}") || {}; } catch(e){}
  function buildWeekly(){
    return courses.map(function(course){
      if(course.id === "english") return {key:course.id, label:"英语作业", href:"#/c/english"};
      var w = PREVIEW_WORD[course.id] || "Unit";
      var cur = getCurUnit(course.id);
      var u = (w === "周") ? ("第"+cur+"周") : ("U"+cur);
      return {key:course.id, label:"完成 "+u+" TG", href:"#/c/"+course.id};
    });
  }
  var weekly = buildWeekly();
  var wd = document.getElementById("homeWeekDates");
  if(wd) wd.textContent = monday+" 至 "+sunday;

  function draw(id, items, done, save, empty){
    var panel = document.getElementById(id);
    if(!panel) return;
    panel.innerHTML = items.map(function(item){
      return '<div class="home-task" style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #dce5ee">' +
        '<label style="display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer"><input type="checkbox" value="'+esc(item.key)+'" '+(done[item.key]?'checked':'')+' style="width:19px;height:19px;flex-shrink:0;accent-color:#28634f"><span style="'+(done[item.key]?'text-decoration:line-through;opacity:.65':'')+'">'+esc(item.label)+'</span></label>' +
        (item.href ? '<a href="'+esc(item.href)+'" style="white-space:nowrap">查看 →</a>' : '') + '</div>';
    }).join("") || '<p class="home-board-date">'+empty+'</p>';
    panel.onchange = function(event){
      if(event.target.type !== "checkbox") return;
      if(event.target.checked) done[event.target.value] = true;
      else delete done[event.target.value];
      save();
      draw(id, items, done, save, empty);
    };
  }

  draw("homeTodayTasks", todayTasks, PP.done, ppSave, todayTasks.length ? "今日任务已完成" : "今天没有排定任务");
  draw("homeWeekTasks", weekly, completed, function(){
    try { localStorage.setItem(weeklyKey, JSON.stringify(completed)); } catch(e) {}
  }, "本周作业已全部完成");

  function drawPreview(){
    var panel = document.getElementById("homePreviewTasks");
    if(!panel) return;
    if(!previewItems.length){ panel.innerHTML = '<p class="home-board-date">暂无课程</p>'; return; }

        '</div>';
    }).join("");

      inp.addEventListener("change", function(){
        var cid = inp.getAttribute("data-cid");
        var n = parseInt(inp.value,10); if(isNaN(n)||n<1) n=1;
        setCurUnit(cid, n);
        previewItems.forEach(function(it){ if(it.cid===cid){ it.cur=n; it.next=n+1; it.label=(it.word==="周"?"预习 第"+(n+1)+"周":"预习 "+it.word+" "+(n+1))+"（"+(names[it.cid]||it.cid)+"）"; } });
        weekly = buildWeekly();
        draw("homeWeekTasks", weekly, completed, function(){
          try { localStorage.setItem(weeklyKey, JSON.stringify(completed)); } catch(e) {}
        }, "本周作业已全部完成");
        drawPreview();
      });
    });
    panel.onchange = function(event){
      if(event.target.type !== "checkbox") return;
      if(event.target.checked) previewDone[event.target.value] = true;
      else delete previewDone[event.target.value];
      try { localStorage.setItem(previewKey, JSON.stringify(previewDone)); } catch(e){}
      drawPreview();
    };
  }
  drawPreview();
}

function hexA(hex, a){
  var m = hex.replace("#","");
  if(m.length===3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
  var r = parseInt(m.substr(0,2),16), g = parseInt(m.substr(2,2),16), b = parseInt(m.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}

/* KaTeX 公式渲染：把笔记里的 $$...$$（块级）与 \(...\)（行内）渲染成数学公式。
   mathematics 等课程的 notesHtml/graphicHtml 已由 build 脚本包好定界符。 */
function renderMathInApp(){
  if (typeof window.renderMathInElement === 'function') {
    try {
      window.renderMathInElement(app, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        ignoredClasses: ['formula', 'frac', 'no-katex'],
        throwOnError: false
      });
    } catch (e) { /* 单条公式出错不影响整页 */ }
  }
  if(window.enhanceFormulaFractions) window.enhanceFormulaFractions(app);
}

/* ============ 学习目标 + 知识大类折叠（全站通用） ============
   原则：不移动任何笔记节点，只给块打标记、在每组首插入标题条。
   这样 KaTeX 公式、图片、表格、已有事件都不受影响；笔记内容一字不改。 */
/* 笔记大类配置已迁入独立板块文件 blocks/notes-layout.js（2026-11-06）。
   用户要求删掉「本周概览与目标」这一大类，笔记打开直接是教授内容；
   骨架不再放分组业务逻辑，改分类只动板块文件。兜底保证脚本未加载时仍能渲染。 */
var NB_GROUPS = (window.NotesGroups && window.NotesGroups.length) ? window.NotesGroups : [{ name:'核心知识点', re:null }];
function nbGroupOf(title){
  var t = String(title || '');
  for(var i=0;i<NB_GROUPS.length;i++){
    if(NB_GROUPS[i].re && NB_GROUPS[i].re.test(t)) return NB_GROUPS[i].name;
  }
  return '核心知识点';
}
function nbPlainTitle(el){
  if(!el) return '';
  var h = /^(H3|H4)$/.test(el.tagName) ? el : (el.querySelector ? el.querySelector('h4.kp-pg-h,h3,h4') : null);
  if(!h) return '';
  var n = h.childNodes[0];
  var t = (n && n.nodeType === 3) ? n.nodeValue : h.textContent;
  return String(t || '').replace(/\s+/g,' ').trim();
}
function nbCollect(container){
  var tops = Array.prototype.slice.call(container.children);
  var starts = [];
  tops.forEach(function(n, i){
    if(!n || !n.tagName) return;
    var isPg = n.classList && n.classList.contains('kp-pg');
    var isHead = /^(H3|H4)$/.test(n.tagName);
    var firstChild = n.firstElementChild;
    var wrapsHead = !isPg && !isHead && firstChild && /^(H3|H4)$/.test(firstChild.tagName);
    if(isPg || isHead || wrapsHead) starts.push(i);
  });
  if(starts.length < 2) return [];
  return starts.map(function(si, k){
    var end = (k + 1 < starts.length) ? starts[k+1] : tops.length;
    var head = tops[si];
    var title = nbPlainTitle(head);
    return {
      head: head,
      nodes: tops.slice(si, end),
      title: title,
      group: nbGroupOf(title),
      page: !!(head.classList && head.classList.contains('kp-pg'))
    };
  });
}
function nbSetBlock(b, collapsed){
  b.__collapsed = !!collapsed;
  if(b.page){
    b.head.classList.toggle('collapsed', b.__collapsed);
  }else{
    b.nodes.forEach(function(n){ if(n !== b.head) n.classList.toggle('nb-hide', b.__collapsed); });
  }
  if(b.__handle) b.__handle.classList.toggle('nb-collapsed', b.__collapsed);
}
function enhanceNotesReading(week){
  try{
    var pane = app.querySelector('.note-pane.active');
    if(!pane) return;
    var allBlocks = [];
    Array.prototype.forEach.call(pane.querySelectorAll('.gx, .notes'), function(c){
      nbCollect(c).forEach(function(b){ b.container = c; allBlocks.push(b); });
    });
    var groups = [];
    if(allBlocks.length >= 3){
      allBlocks.forEach(function(b){
        var gi = -1;
        for(var i=0;i<groups.length;i++){ if(groups[i].name === b.group){ gi = i; break; } }
        if(gi < 0){ gi = groups.length; groups.push({name:b.group, blocks:[], bars:[]}); }
        b.__grp = gi;
        groups[gi].blocks.push(b);
        var h = b.page ? b.head.querySelector('h4.kp-pg-h')
                       : (/^(H3|H4)$/.test(b.head.tagName) ? b.head : b.head.querySelector('h3,h4'));
        if(h){ h.classList.add('nb-handle'); h.__nbBlock = b; b.__handle = h; }
        if(b.page && !b.head.id) b.head.id = 'kp-sec-' + allBlocks.indexOf(b);
      });
      groups.forEach(function(g, gi){
        var seen = [];
        g.blocks.forEach(function(b){
          if(seen.indexOf(b.container) >= 0) return;
          seen.push(b.container);
          var bar = document.createElement('button');
          bar.type = 'button';
          bar.className = 'nb-grp-h closed';
          bar.setAttribute('data-grp', String(gi));
          bar.innerHTML = '<span class="nb-grp-n"></span><span class="nb-grp-c">' + g.blocks.length + ' 节</span><span class="nb-grp-a">▸</span>';
          bar.querySelector('.nb-grp-n').textContent = g.name;
          b.head.parentNode.insertBefore(bar, b.head);
          g.bars.push(bar);
        });
      });
      allBlocks.forEach(function(b){ nbSetBlock(b, true); });
    }
    var tools = document.createElement('div');
    tools.className = 'reading-tools nb-tools';
    var html = '';
    /* 「本周要掌握」卡片已移除（2026-11-06）：与页面上方「本周学习目标」内容重复，只保留学习目标区块 */
    if(groups.length){
      html += '<div class="rt-row"><span class="rt-label">笔记大类 · ' + groups.length + ' 组 / ' + allBlocks.length + ' 节</span>' +
              '<button type="button" class="rt-btn" data-fold="collapse">全部收起</button>' +
              '<button type="button" class="rt-btn" data-fold="expand">全部展开</button></div>' +
              '<div class="nb-chips">';
      groups.forEach(function(g, i){
        html += '<button type="button" class="rt-chip" data-grp="' + i + '">' + esc(g.name) + ' · ' + g.blocks.length + '</button>';
      });
      html += '</div><div class="nb-tip">点大类只展开那一类；大类按钮可左右滑动；点小节标题可单独展开/收起</div>';
    }
    if(html){ /* 没有笔记大类工具时，不再插入空的工具框 */
      tools.innerHTML = html;
      pane.insertBefore(tools, pane.firstChild);
    }
    function setGroups(mode){
      var only = (typeof mode === 'number') ? mode : -1;
      allBlocks.forEach(function(b){
        var collapsed = (mode === 'all-closed') || (only >= 0 && b.__grp !== only);
        nbSetBlock(b, collapsed);
      });
      groups.forEach(function(g, i){
        var closed = (mode === 'all-closed') || (only >= 0 && i !== only);
        g.bars.forEach(function(bar){ bar.classList.toggle('closed', closed); });
      });
    }
    tools.addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('button') : null;
      if(!b) return;
      if(b.getAttribute('data-fold')){
        setGroups(b.getAttribute('data-fold') === 'collapse' ? 'all-closed' : 'all-open');
        return;
      }
      var gi = b.getAttribute('data-grp');
      if(gi !== null && gi !== undefined && groups[+gi]){
        setGroups(+gi);
        var bar = groups[+gi].bars[0];
        if(bar && bar.scrollIntoView) bar.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
    pane.addEventListener('click', function(ev){
      if(!ev.target.closest) return;
      var bar = ev.target.closest('.nb-grp-h');
      if(bar){
        var gi = +bar.getAttribute('data-grp');
        var g = groups[gi];
        if(!g) return;
        var closing = !bar.classList.contains('closed');
        g.blocks.forEach(function(b){ nbSetBlock(b, closing); });
        g.bars.forEach(function(x){ x.classList.toggle('closed', closing); });
        return;
      }
      var h = ev.target.closest('.nb-handle');
      if(!h || !h.__nbBlock) return;
      var control = ev.target.closest('a,button,input,select,textarea,label,summary,[role="button"],[contenteditable]');
      if(control && control !== h && h.contains(control)) return;
      nbSetBlock(h.__nbBlock, !h.__nbBlock.__collapsed);
    });
    var btn = document.querySelector('.to-top');
    if(!btn){
      btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'to-top'; btn.title = '回到顶部'; btn.textContent = '↑';
      document.body.appendChild(btn);
      window.addEventListener('scroll', function(){ btn.classList.toggle('show', window.scrollY > 500); }, {passive:true});
    }
    btn.onclick = function(){ window.scrollTo({top:0, behavior:'smooth'}); };
  }catch(e){ /* 增强失败不影响笔记本身 */ }
}
