function renderCourse(courseId, termId, weekNum){
  var course = findCourse(courseId);
  if(!course){ app.innerHTML = '<div class="container loading">课程不存在：'+esc(courseId)+'</div>'; return; }
  var chapterTotal = (course.terms || []).reduce(function(n,t){ return n + (t.weeks || []).length; }, 0);
  if(!chapterTotal){ renderEmptyBook(course); return; }
  var reviewMode = (weekNum === "review");
  /* 点开课程（未指定学期）时，跨所有学期定位到第一个未完成的周/章，
     这样「经济完成 U4 就直接跳到 U5」。指定了学期则只在该学期内找。 */
  var firstIncomplete = firstIncompleteWeek(course);
  var term = findTerm(course, termId || (reviewMode ? (course.terms[0] && course.terms[0].id) : firstIncomplete.termId));
  var weeks = term.weeks;
  /* 进入时自动定位：显式指定周/章 → 用之；否则 → 上次读到的位置；
     无历史 → 第一个未完成的周/章；全部完成 → 第一个 */
  var wnum;
  if(reviewMode){
    wnum = weeks.length ? weeks[0].num : 1;
  } else if(weekNum){
    wnum = weekNum;
  } else {
    /* 优先：跳到当前学期第一个未完成的周/章（点开课程即落到该学的内容）；
       仅当该学期已全部完成，才回退到「上次读到的位置」或第一周 */
    var readingSequence = course.reading ? weeks.filter(function(w){ return !w.displayLabel; }) : weeks;
    if(!readingSequence.length) readingSequence = weeks;
    wnum = readingSequence.length ? readingSequence[0].num : 1;
    for(var fi=0; fi<readingSequence.length; fi++){
      if(!state.weeks[weekKey(course.id, term.id, readingSequence[fi].num)]){ wnum = readingSequence[fi].num; break; }
    }
    var lpKey2 = course.id + "/" + term.id;
    var savedPos = state.lastpos ? state.lastpos[lpKey2] : null;
    if(savedPos){
      var allDone = true;
      for(var ad=0; ad<readingSequence.length; ad++){ if(!state.weeks[weekKey(course.id, term.id, readingSequence[ad].num)]){ allDone = false; break; } }
      if(allDone){
        var okPos = false;
        for(var sv=0; sv<weeks.length; sv++){ if(weeks[sv].num === savedPos){ okPos = true; break; } }
        if(okPos) wnum = savedPos;
      }
    }
  }
  var week = null;
  for(var i=0;i<weeks.length;i++) if(weeks[i].num === wnum){ week = weeks[i]; break; }
  if(!week) week = weeks[0];
  /* 记录「上次读到的位置」（静默保存，不弹提示） */
  if(!reviewMode && week){
    var lpKey = course.id + "/" + term.id;
    if(state.lastpos[lpKey] !== week.num){ state.lastpos[lpKey] = week.num; saveStateQuiet(); }
    /* 记录「最后访问的主课程」，用于打开网站时自动回到笔记 */
    if(!course.extra && !course.reading){
      if(!state.lastCourse || state.lastCourse.cid !== course.id || state.lastCourse.tid !== term.id){
        state.lastCourse = { cid: course.id, tid: term.id };
        saveStateQuiet();
      }
    }
  }
  var p = courseProgress(course);

  var html = '<div class="container">';
  var crumbLabel = course.reading ? "读书" : (course.extra ? "课外拓展" : "课程中心");
  var crumbHash = course.reading ? "#/reading" : (course.extra ? "#/extra" : "#/courses");
  html += '<div class="crumb"><a data-nav="#/">首页</a><span class="sep">/</span><a data-nav="'+crumbHash+'">'+crumbLabel+'</a><span class="sep">/</span><span>'+esc(course.nameCn)+'</span></div>';

  /* course hero */
  html += '<div class="course-hero'+(!course.reading && !course.extra ? ' cabin-chapter section-banner' : '')+'" style="background:linear-gradient(135deg,'+shade(course.color,-28)+' 0%,'+course.color+' 65%,'+shade(course.color,18)+' 100%)">' +
    '<div class="ch-row"><div class="ch-icon">'+courseIcon(course)+'</div>' +
    '<div class="ch-title"><h1>'+esc(course.nameCn)+'</h1><div class="en">'+esc(course.name)+'</div><span class="code">'+esc(course.code||"")+'</span></div>';
  if(course.terms.length > 1){
    html += '<div class="term-tabs">';
    course.terms.forEach(function(t){
      html += '<button class="term-tab'+(t.id===term.id?" active":"")+'" data-term="'+t.id+'">'+esc(t.name)+'</button>';
    });
    html += '</div>';
  }
  html += '</div>';
  if(p.total) html += '<div style="position:relative;z-index:1;margin-top:18px;display:flex;align-items:center;gap:12px"><div style="flex:1;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden"><div style="height:100%;width:'+Math.round(p.done/p.total*100)+'%;background:var(--gold);border-radius:3px"></div></div><span style="font-size:12.5px;color:#e8eef6">已完成 '+p.done+' / '+p.total+' '+(course.extra?'个模块':(course.reading?'章':'周'))+'</span></div>';
  html += '</div>';

  /* body: 左侧树形知识点目录 + 右侧笔记面板 */
  html += '<div class="course-body"><div class="week-side">' +
    '<details class="ws-week-nav"><summary class="ws-head"><span class="ws-title">周次导航</span><span class="ws-term">'+esc(term.name)+'</span></summary><div class="ws-list">';
  if(course.examReview){
    html += '<div class="ws-item exam-review-item'+(reviewMode?' active':'')+'" data-week="review">' +
      '<div class="ws-num er">📝</div>' +
      '<div class="ws-info"><div class="t">考试总复习</div><div class="s">全部考点 · 按考试顺序</div><div class="s">一份搞定</div></div>' +
      '</div>';
  }
  weeks.forEach(function(w){
    var wk = weekKey(course.id, term.id, w.num);
    var isDone = state.weeks[wk];
    var ts = weekTaskStats(course, term, w);
    var sub = (w.files||[]).length + " 份课件";
    if(ts.total) sub += " · " + ts.done + "/" + ts.total + " 任务";
    if(!weekHasContent(w)) sub = "资料整理中";
    var isCur = !!(week && !reviewMode && w.num === week.num);
    html += '<div class="ws-group'+(isCur?' open':'')+'" data-group="'+w.num+'">';
    html += '<div class="ws-item'+(isCur?" active":"")+(isDone?" done":"")+'" data-week="'+w.num+'">' +
      '<div class="ws-num">'+(isDone?"✓":w.num)+'</div>' +
      '<div class="ws-info"><div class="t">'+(w.displayLabel ? esc(w.displayLabel) : course.extra?'模块 '+w.num:course.reading?'第 '+w.num+' 章':'Week '+w.num)+'</div><div class="s">'+esc(w.title)+'</div><div class="s">'+sub+'</div></div>' +
      '<input type="checkbox" class="ws-check" data-weekdone="'+w.num+'" '+(isDone?"checked":"")+' title="'+(course.extra?'标记本模块已完成':course.reading?'标记本章已完成':'标记本周已完成')+'"></div>';
    html += '</div>';
  });
  html += '</div></details>';
  if(week && !reviewMode){
    var w = week;
    var elasticityOutline = course.id === "economics" && term.id === "term1" && w.num === 5;
    if(elasticityOutline && w.graphicHtml && !w.graphicHtml.includes("影响供给价格弹性的因素</h4>")){
      w.graphicHtml = w.graphicHtml.replace("<p>The single most important determinant", '<h4 class="kp-h">影响供给价格弹性的因素</h4><p>The single most important determinant');
    }
    var kps = kpItems(w);
    html += '<section class="ws-note-outline ws-group open" data-group="'+w.num+'"><div class="ws-head"><span class="ws-title">学习笔记目录</span>' +

      '<button type="button" class="kp-tools-btn" id="kpSearchBtn" aria-label="搜索知识点">🔍</button></div>' +
      '<div class="kp-search-wrap" id="kpSearchWrap"><input id="kpSearchInput" type="text" placeholder="搜索本周知识点…" aria-label="搜索本周知识点"></div>';
    if(kps.length){
      html += '<div class="kp-list">';
      if(elasticityOutline){
        var topics = [
          ["TED", /^Price Elasticity of Demand/],
          ["Midpoint Formula", /^Calculating PED: midpoint formula/],
          ["Total Revenue", /^Total Revenue Test/],
          ["Marginal Revenue and Average Revenue", /TR、AR、MR 与 Q1/],
          ["Determinants of ED", /^Determinants of PED/],
          ["收入弹性", /^Income Elasticity of Demand/],
          ["交叉价格弹性", /^Cross Elasticity of Demand/],
          ["供给价格弹性", /^Price Elasticity of Supply/],
          ["影响供给价格弹性的因素", /^影响供给价格弹性的因素$/]
        ];
        topics.forEach(function(topic, index){
          var target = kps.findIndex(function(item){ return topic[1].test(item.text); });
          if(target < 0) return;

        });
      }

/* ============ 复习导航（普通周页 / 英语周页共用） ============
   把「学完就忘」改成有明确时间点、有可验证完成标准的回看动作。

var MINDMAP_URL = "mindmap.html?v=20261106-review1"; /* ← 导图做好后：文件仍是 mindmap.html，只把 v= 换成新版本号，浏览器才会加载新版 */
function rvHref(course, term, n){ return "#/c/" + course.id + "/" + term.id + "/" + n; }
function rvHasWeek(term, n){

/* 本周打卡已移除（2026-11-06）：预习 / 作业勾选统一在「本周任务」完成，避免重复 */
/* ============ 知识点树形目录（全学科通用） ============
   扫描每周笔记里的小标题，抽成「一个小知识点一个分录」的目录条目；
   同时给正文标题打 data-kp 锚点，点目录即平滑滚动直达并高亮。
   与「本周 Activity 导航」并存：原有周次导航 + Activity 页签跳转全部保留。 */
var KP_CACHE = new WeakMap();
var KP_ENT = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&nbsp;':' ','&#39;':"'",'&#x27;':"'",'&mdash;':'—','&ndash;':'–','&hellip;':'…'};
function kpText(s){
  var t = String(s||'').replace(/<[^>]+>/g,' ');
  t = t.replace(/&(?:amp|lt|gt|quot|nbsp|mdash|ndash|hellip|#39|#x27);/gi, function(m){ return KP_ENT[m.toLowerCase()] || m; });
  t = t.replace(/\$\$[\s\S]*?\$\$/g,' ').replace(/\\[()]/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
var KP_HEAD_RE = /<(h[234])([^>]*)>([\s\S]*?)<\/\1>/gi;
/* 纯页码例题（如「✏️ 第 12 页 · 例题」）不是知识点，目录里不列；正文内容不受影响 */
function kpSkip(t){
  return /^✏️\s*第\s*\d+\s*页\s*[·・:：\-—]?\s*例题\s*$/.test(t);
}
/* 扫描顺序与 kpInject 严格一致，保证目录条目和正文锚点一一对应 */
function kpScan(html){
  var raw = [], hasMain = false, m;
  if(!html) return [];
  KP_HEAD_RE.lastIndex = 0;
  while((m = KP_HEAD_RE.exec(html))){
    var tag = m[1].toLowerCase();
    var cls = (/\bclass=["']([^"']*)["']/.exec(m[2]) || [,''])[1];
    var txt = kpText(m[3]);
    if(txt.length < 2 || kpSkip(txt)) continue;
    if(raw.length >= 120) break;
    raw.push({tag:tag, cls:cls, text:txt});
    if(/kp-h/.test(cls) && !/kp-pg-h/.test(cls)) hasMain = true;
    if(/💻\s*Week/i.test(txt)) hasMain = true;
  }
  return raw.map(function(r){
    var lv = 1;
    if(/kp-pg-h/.test(r.cls)) lv = 2;
    else if(/^Step\s*\d+/i.test(r.text) || /^✏️/.test(r.text)) lv = 2;
    else if(r.tag === 'h4' && hasMain && !/kp-h/.test(r.cls)) lv = 2;
    return {text:r.text, label:r.text.slice(0, 46), level:lv,
      tag:r.tag, cls:r.cls, pg:(/kp-pg-h/.test(r.cls) || /^Step\s*\d+/i.test(r.text) || /^✏️/.test(r.text))};
  });
}
function kpItems(week){
  if(KP_CACHE.has(week)) return KP_CACHE.get(week);
  var items = kpScan(week.graphicHtml || week.notesHtml || '');
  KP_CACHE.set(week, items);
  return items;
}
/* ===== 目录分组：目录不再一条条平铺 =====
   1. 以 Unit / Lecture / Reading / Activity / 主题前缀 为「大板块」，一张卡片一个板块；
   2. 同一板块里的逐页知识点收在卡片下面，仍可一条条点击跳转；
   3. 连续的「例题 / 练习 / 答案」标题合并成一组（例如 Lecture 例 1、例 2 答案放一起）；
   4. 条目很少的周次不分组，保持原来的简洁平铺。 */
var KP_GROUPS = new WeakMap();
function kpAnsLike(t){ return /答案|Answers?|Worked Example|Practice|例题|练习|Exercise|Quiz/i.test(t); }
function kpPrefixOf(t){
  var m = /^([A-Za-z][A-Za-z0-9 &/+'\-]{1,34}?)\s*[:：]/.exec(String(t||''));
  return m ? m[1].trim() : '';
}
function kpEscRe(s){ return String(s||'').replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function kpGroups(week){
  if(KP_GROUPS.has(week)) return KP_GROUPS.get(week);
  var items = kpItems(week);
  if(items.length <= 8){ KP_GROUPS.set(week, null); return null; }
  /* 主题前缀：出现 2 次以上才算板块；短前缀并入包含它的长前缀，避免 Surds / Indices 各自成组 */
  var pcount = {}, plabel = {};
  items.forEach(function(it){
    var p = kpPrefixOf(it.text);
    if(p){ var k = p.toLowerCase(); pcount[k] = (pcount[k]||0)+1; if(!plabel[k]) plabel[k] = p; }
  });
  var pkeys = Object.keys(pcount).filter(function(k){ return pcount[k] >= 2; });
  var pcanon = {};
  pkeys.forEach(function(k){
    var best = k;
    pkeys.forEach(function(q){ if(q !== k && q.indexOf(k) >= 0 && q.length > best.length) best = q; });
    pcanon[k] = best;
  });
  /* 连续的例题 / 答案条目合并成一组 */
  var ansOf = {}, run = [];
  var flushRun = function(){
    if(run.length >= 2 && run.filter(function(x){ return !x.pg; }).length >= 2){
      var label = '例题与答案';
      if(run.some(function(x){ return /^Lecture/i.test(x.text); })) label = 'Lecture 例题与答案';
      else if(run.some(function(x){ return /^Reading/i.test(x.text); })) label = 'Reading 例题与答案';
      else if(run.some(function(x){ return /补充/.test(x.text); })) label = '补充练习与答案';
      run.forEach(function(x){ ansOf[x.i] = {key:'A'+run[0].i, label:label}; });
    }
    run = [];
  };
  items.forEach(function(it, idx){
    if(kpAnsLike(it.text)) run.push({i:idx, pg:!!it.pg, text:it.text});
    else flushRun();
  });
  flushRun();
  /* 顺序归并 */
  var groups = [], byKey = {}, cur = null, lastReal = null;
  var shortLabel = function(t){ return t.length > 60 ? t.slice(0, 58) + '…' : t; };
  items.forEach(function(it, idx){
    var key = '', label = '', synthetic = false, strip = '', title = it.text;
    var a = ansOf[idx];
    var unit = /^Unit\s*(\d+)/i.exec(it.text);
    var px = kpPrefixOf(it.text), pkey = px ? pcanon[px.toLowerCase()] : '';
    if(a){ key = a.key; label = a.label; synthetic = true; }
    else if(/^💻\s*Week/i.test(it.text)){ key = 'S'+idx; label = shortLabel(it.text); }
    else if(/逐页精读|Reading Materials|（Lecture）/i.test(it.text)){ key = 'S'+idx; label = shortLabel(it.text); }
    else if(unit && !it.pg){ key = 'U'+unit[1]; label = shortLabel(it.text); }
    else if(pkey && !it.pg){ key = 'P'+pkey; label = plabel[pkey] || px; strip = kpEscRe(px); }

      }
      if(!cur.synthetic) lastReal = cur;
    }
    if(!cur){
      cur = {key:'ALL', label:'本周知识点', first:idx, title:'本周知识点', strip:'', items:[], synthetic:true};
      byKey.ALL = cur; groups.push(cur); start = true;
    }
    /* 答案组后面出现的逐页标题，归回上一个正文板块，不混进答案组 */
    var target = cur;
    if(key === '' && it.pg && cur.synthetic && lastReal && lastReal !== cur) target = lastReal;
    /* 板块标题本身由卡片代表；其余条目（含合成组里所有条目）作为细目列出 */
    if(synthetic || !start || key === ''){
      target.items.push({i:idx, label:it.label, text:it.text});

  });
  /* 兜底组只有一两条时，用该条知识点当卡片名，不显示空泛的「本周知识点」 */
  groups.forEach(function(g){
    if(g.key === 'ALL' && g.items.length && g.items.length <= 2){
      g.label = g.items[0].label;
      g.title = g.items[0].text;

  for(var gi = groups.length - 1; gi >= 0; gi--){
    var g = groups[gi];
    if(groups.length > 1 && !g.synthetic && g.items.length <= 1 && gi > 0){
      var prev = groups[gi-1];
      prev.items.push({i:g.first, label:(g.label || '').slice(0,46), text:g.title});
      g.items.forEach(function(x){ prev.items.push(x); });
      groups.splice(gi, 1);
    }
  }

  return groups;
}
function kpInject(html, weekNum){
  if(!html) return html || '';
  var i = 0;
  KP_HEAD_RE.lastIndex = 0;
  return html.replace(KP_HEAD_RE, function(m, tag, attrs, inner){
    var t = kpText(inner);
    if(t.length < 2 || kpSkip(t)) return m;
    if(i >= 120) return m;
    var id = 'kp-' + weekNum + '-' + i;
    i++;
    attrs = attrs.replace(/\s+data-kp="[^"]*"/g, '');
    return '<' + tag + attrs + ' data-kp="' + id + '">' + inner + '</' + tag + '>';
  });
}
/* 目录高亮：当前知识点 + 它所在的大板块一起亮，隐藏的板块自动展开 */
function kpSetActive(id, expand){
  var act = null;
  Array.prototype.forEach.call(app.querySelectorAll('.kp-item'), function(b){
    var on = b.getAttribute('data-kp-jump') === id;
    b.classList.toggle('active', on);
    if(on) act = b;
  });
  Array.prototype.forEach.call(app.querySelectorAll('.kp-grp'), function(g){ g.classList.remove('cur'); });
  if(act && act.closest){
    var pg = act.closest('.kp-grp');
    if(pg){
      pg.classList.add('cur');
      /* 只有主动点击跳转才展开收起的板块；滚动跟随不打断用户手动收起的状态 */
      if(expand && pg.classList.contains('collapsed')){
        pg.classList.remove('collapsed');
        var tg = pg.querySelector('.kp-tog');
        if(tg) tg.textContent = '▾';
      }
    }
  }
}

var kpSpyBound = false;
function bindKpScrollSpy(){
  if(kpSpyBound) return; kpSpyBound = true;
  var ticking = false;
  window.addEventListener('scroll', function(){
    if(ticking) return; ticking = true;
    (window.requestAnimationFrame || function(f){ setTimeout(f, 60); })(function(){
      ticking = false;
      var els = app.querySelectorAll('[data-kp]');
      if(!els.length) return;
      var best = null, bestTop = -Infinity;
      Array.prototype.forEach.call(els, function(el){
        var top = el.getBoundingClientRect().top;
        if(top <= 175 && top > bestTop){ bestTop = top; best = el; }
      });
      if(!best) return;
      kpSetActive(best.getAttribute('data-kp'), false);
    });
  }, {passive:true});
}

/* 活动页签导航：扫描每周 graphicHtml 里的「💻 Week X — Activity N：标题」真实活动标题，
   自动给每个活动加锚点 id 并生成 1:1 的页签（有几个活动就做几个页签，数据驱动、不漏不硬编码） */
function buildActivityNav(gxHtml){
  if(!gxHtml) return { html:"", acts:[] };
  var acts = [];
  var re = /<h3([^>]*)>(💻\s*Week\s*\d+\s*[—-]\s*(Activity\s*\d+[a-z]?|Challenge(?:\s*\d+[a-z]?)?|Task)[：:]\s*([^<]*))<\/h3>/gi;
  var htmlOut = gxHtml.replace(re, function(m, attrs, inner, label, title){
    var num = acts.length + 1;
    acts.push({ n: num, label: label.trim(), title: title.trim() });
    attrs = attrs.replace(/\s+id="[^"]*"/g, "");
    if(/class=/.test(attrs)) attrs = attrs.replace(/class="([^"]*)"/, 'class="$1 act-target"');
    else attrs += ' class="act-target"';
    return '<h3' + attrs + ' id="act-' + num + '">' + inner + '</h3>';
  });
  return { html:htmlOut, acts:acts };
}

      html += '<div class="act-nav"><div class="act-nav-t">🧭 本周 Activity 导航 · 共 '+an.acts.length+' 个（点页签直达对应 Activity）</div>';
      an.acts.forEach(function(a){
        html += '<button type="button" class="act-chip" data-act="'+a.n+'" title="'+esc(a.title)+'">'+esc(a.label)+'</button>';
      });
      html += '</div>';
    }
    html += '<div class="gx">'+kpInject(an.html, week.num)+'</div>';
  } else if(week.notesHtml){
    html += '<div class="notes">'+kpInject(week.notesHtml, week.num)+'</div>';
  } else {
    html += '<div class="empty-hint">本篇笔记正在生成中。你可以先浏览下方课件，或直接向我提问本周内容。</div>';
  }
  /* 合并：PPT 内例题已并入 graphicHtml 讲解流（按知识点顺序跟随，不再单独渲染）
     examplesHtml 字段保留为占位串「已并入讲解流…」，此处跳过，避免出现独立「PPT 内例题」板块 */
  if(week.prepQuestions && week.prepQuestions.length){
    html += '<div class="prep-q" style="margin-top:14px"><div class="pq-t">课前思考 · 带着问题去上课</div><ol>';
    week.prepQuestions.forEach(function(q){ html += '<li>'+esc(q)+'</li>'; });
    html += '</ol></div>';
  }
  html += '</div>';
  if(originalUrl){
    var href = esc(originalUrl);
    html += '<div class="note-pane" data-pane="original"><p><a href="'+href+'" target="_blank" rel="noopener">在新窗口打开原文 ↗</a></p>' +
      '<iframe title="'+esc(course.nameCn)+'原文" data-original-src="'+href+'" style="display:block;width:100%;height:78vh;min-height:420px;border:1px solid var(--line-2)"></iframe></div>';
  }
  /* 面板2: 课后作业答案（独立标签页，内容 = tutorialAnswers） */
  if(hasAnswers){
    html += '<div class="note-pane" data-pane="answers"><div class="gx answers">'+week.tutorialAnswers+'</div></div>';
  }
  html += '</div>'; /* 关闭「文字版」视图容器 */
  if(window.NoteViews) html += window.NoteViews.extraPanesHtml();
  html += '</div>';

  html += window.renderNoteGlossary(week, esc);

  /* 其他资料已并入上方「资料下载」二级分组，这里不再单独占一个板块 */

  /* (本周任务已移到最前并改为可折叠) */

  html += '</div>';
  return html;
}

function bindNoteExport(course, term, week){
  var self = document.getElementById('app');
  if(!self) return;
  var pane = self.querySelector('.note-pane.active') || self.querySelector('.er-export-target');
  if(!pane) return;
  var isEr = !!self.querySelector('.er-export-target');
  var mt = /Unit\s*([0-9]+(?:\s*[–\-]\s*[0-9]+)?)/i.exec(week.title||"");
  var unitTag = week.displayLabel ? esc(week.displayLabel) : mt ? "UNIT " + mt[1].replace("–","-") : (course.extra ? "MODULE " + week.num : (course.reading ? "CHAPTER " + week.num : "WEEK " + week.num));
  var title = isEr
    ? ((course.nameCn||course.id) + " · 考试总复习")
    : ((course.nameCn||course.id) + " · " + (term.name||"") + " · " + unitTag + (week.title ? " · " + week.title : ""));
  var meta = {
    title: title,
    meta: isEr ? ("考试总复习 ｜ " + (course.nameCn||"")) : (unitTag + " ｜ " + (course.nameCn||"") + " ｜ " + (term.name||"")),
    file: isEr ? ((course.id||"note") + "_考试总复习") : ((course.id||"note") + "_W" + week.num + "_笔记")
  };
  Array.prototype.forEach.call(self.querySelectorAll('.ne-btn'), function(b){
    b.addEventListener('click', function(){
      if(b.getAttribute('data-exp') === 'pdf'){ exportNotePdf(meta, pane); }
      else { exportNoteWord(meta, pane.innerHTML); }
    });
  });
}

/* 真正把笔记导出成 .pdf 文件下载（用 html2pdf 引擎）；
   若离线导致引擎未加载，则退回浏览器打印对话框。 */
async function exportNotePdf(meta, paneEl){
  if(typeof html2pdf === 'undefined'){
    showPdfOverlay('正在准备 PDF 导出…');
    try { await loadOptionalScript('vendor/html2pdf.bundle.min.js'); }
    catch(error) { /* 下载失败时保留原有打印后备方案。 */ }
    finally { hidePdfOverlay(); }
  }
  if(typeof html2pdf === "undefined"){
    var oldTitle = document.title;
    document.title = meta.file;
    document.body.classList.add('print-notes');
    function cleanup(){
      document.body.classList.remove('print-notes');
      document.title = oldTitle;
      window.removeEventListener('afterprint', cleanup);
    }
    window.addEventListener('afterprint', cleanup);
    window.print();
    setTimeout(function(){ if(document.body.classList.contains('print-notes')) cleanup(); }, 2500);
    return;
  }
  var target = paneEl || document.querySelector('.note-pane.active') || document.querySelector('.er-export-target');
  if(!target){ alert('没有可导出的内容。'); return; }
  showPdfOverlay('正在生成 PDF，请稍候…');
  var clone = target.cloneNode(true);
  clone.querySelectorAll('.ne-btn,.note-tabs,.note-exp,.coll-arrow,.coll-head,.ws-check,.task-row .t-type,.reading-tools,.nb-grp-h,.nb-tip,.goal-more,.goal-topics,.to-top').forEach(function(n){ n.remove(); });
  clone.querySelectorAll('.nb-hide,.kp-pg.collapsed').forEach(function(n){ n.classList.remove('nb-hide','collapsed'); });
  clone.querySelectorAll('.nb-handle').forEach(function(n){ n.classList.remove('nb-handle'); });
  var holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-99999px;top:0;width:820px;background:#fff;padding:26px 30px;box-sizing:border-box;';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  var opt = {
    margin:[10,10,12,10],
    filename: meta.file + '.pdf',
    image:{ type:'jpeg', quality:0.98 },
    html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff', windowWidth:820, logging:false },
    jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak:{ mode:['css','legacy'] }
  };
  try{
    html2pdf().set(opt).from(clone).save()
      .then(function(){ hidePdfOverlay(); if(holder.parentNode) holder.remove(); })
      .catch(function(err){ hidePdfOverlay(); if(holder.parentNode) holder.remove(); if(window.console) console.error(err); alert('生成 PDF 失败，请改用「下载 Word」。'); });
  }catch(e){ hidePdfOverlay(); if(holder.parentNode) holder.remove(); alert('生成 PDF 失败，请改用「下载 Word」。'); }
}

function bindErTabs(){

function renderFileGroups(course, files){
  var isPend = window.isPendingFile || function(){ return false; };
  var groups = {};
  var order = ["lecture","reading","tutorial","lecture-notes","worksheet","practice","exam","assessment","reference","excel","doc","ppt","audio","video","image","info","zip","other"];
  files.forEach(function(f){
    var r = f.role || "other";
    if(!groups[r]) groups[r] = [];
    groups[r].push(f);
  });
  var html = "";
  order.forEach(function(r){
    if(!groups[r]) return;
    var grp = groups[r];
    var pend = grp.filter(isPend).length;
    html += '<div class="file-group"><div class="fg-head">'+esc(ROLE_LABEL[r]||r)+' · '+grp.length+(pend?(' <span class="fg-pending">'+pend+' 待补传</span>'):'')+'</div>';
    grp.forEach(function(f){
      var ext = (f.ext||"").toUpperCase();
      if(isPend(f)){
        html += '<div class="file-row file-pending"><div class="f-ext" style="background:#9aa6b2">'+esc(ext)+'</div>' +
          '<div class="f-main"><div class="f-name">'+esc(f.name)+'</div>' +
          '<div class="f-meta">'+esc(ROLE_LABEL[f.role]||"文件")+' · 待补传</div></div>' +
          '<div class="f-actions"><span class="f-pending-tag">待补传</span></div></div>';
      } else {
        var color = EXT_COLOR[f.ext] || "#4a5568";
        html += '<div class="file-row"><div class="f-ext" style="background:'+color+'">'+esc(ext)+'</div>' +
          '<div class="f-main"><div class="f-name">'+esc(f.name)+'</div>' +
          '<div class="f-meta">'+esc(ROLE_LABEL[f.role]||"文件")+' · '+fmtSize(f.size)+'</div></div>' +
          '<div class="f-actions"><a class="f-open" href="'+fileHref(course,f)+'" target="_blank" rel="noopener">打开 ↗</a>' +
          '<a class="f-open f-download" href="'+fileHref(course,f)+'" download>下载</a></div></div>';
      }
    });
    html += '</div>';
  });
  return html;
}
/* 课程级通用资料（原「其他文件」）：统一收进「资料下载」大标题下，作为二级分组，
   不再单独占一个板块；超过 12 份时其余文件折叠，避免资料下载一展开就淹没正文。 */
function renderOtherFiles(course){
  var files = course.generalFiles || [];
  if(!files.length) return '';
  var pend = (window.countPending || function(){ return 0; })(files);
  var html = '<div class="fg-sub"><div class="fg-sub-t"><span class="ic">📁</span>其他资料 · 课程通用<span class="cnt">'+files.length+(pend?(' · '+pend+' 待补传'):'')+' 份</span></div>';
  html += renderFileGroups(course, files.slice(0, 12));
  if(files.length > 12){
    html += '<details class="fg-more"><summary>展开其余 '+(files.length-12)+' 份文件</summary>' +
      renderFileGroups(course, files.slice(12)) + '</details>';
  }
  return html + '</div>';
}

var originalTextUrls = new Map();
function bindWeekPanel(course, term, week){
  var mk = document.getElementById("markWeekBtn");
  if(mk){
    mk.addEventListener("click", function(){
      var k = weekKey(course.id, term.id, week.num);
      if(state.weeks[k]){ delete state.weeks[k]; } else { state.weeks[k] = true; }
      saveState();
      renderCourse(course.id, term.id, week.num);
    });
  }
  Array.prototype.forEach.call(app.querySelectorAll("[data-task]"), function(cb){
    cb.addEventListener("change", function(){
      var idx = parseInt(cb.getAttribute("data-task"),10);
      var k = taskKey(course.id, term.id, week.num);
      if(!state.tasks[k]) state.tasks[k] = {};
      if(cb.checked){ state.tasks[k][idx] = true; } else { delete state.tasks[k][idx]; }
      saveState();
      var row = cb.closest(".task-row");
      if(row) row.classList.toggle("done", cb.checked);
      var ts = weekTaskStats(course, term, week);
      /* 进度按页面上真实可勾的任务框计算（英语周页只显示作业类任务） */
      var taskInputs = app.querySelectorAll("input[data-task]");
      var taskChecked = app.querySelectorAll("input[data-task]:checked").length;
      var bar = app.querySelector(".task-progress .bar i");
      var txt = app.querySelector(".task-progress .txt");
      if(bar) bar.style.width = (taskInputs.length?Math.round(taskChecked/taskInputs.length*100):0) + "%";
      if(txt) txt.textContent = taskChecked + " / " + taskInputs.length;
      var headCnt = app.querySelector("#wpTasks .coll-head .cnt");
      if(headCnt) headCnt.textContent = ts.done + "/" + ts.total + " 完成 · 点开查看";
      /* 本周任务全部勾完 → 自动把左侧这一周标为已完成（原「本周打卡」的联动迁移至此） */
      var allChecked = taskInputs.length > 0 && taskChecked === taskInputs.length;
      var wk = weekKey(course.id, term.id, week.num);
      if(allChecked && !state.weeks[wk]){
        state.weeks[wk] = true;
        saveState();
        var sideItem = app.querySelector('.ws-item[data-week="' + week.num + '"]');
        if(sideItem){
          sideItem.classList.add("done");
          var numEl = sideItem.querySelector(".ws-num");
          if(numEl) numEl.textContent = "✓";
          var wc = sideItem.querySelector(".ws-check");
          if(wc) wc.checked = true;
        }
        var mkBtn = document.getElementById("markWeekBtn");
        if(mkBtn){
          mkBtn.classList.add("is-done");
          mkBtn.textContent = "✓ " + (course.extra ? "模块" : (course.reading ? "本章" : "本周")) + "已完成";
        }
      }
    });
  });
  /* 复习导航：「跳到本周笔记」——滚动到笔记标签并切回「笔记」页签 */
  Array.prototype.forEach.call(app.querySelectorAll("[data-rv-note]"), function(btn){
    btn.addEventListener("click", function(){
      var tabs = app.querySelector(".note-tabs") || app.querySelector(".nv-switch");
      if(tabs){
        tabs.scrollIntoView({behavior:"smooth", block:"start"});
        if(window.NoteViews) window.NoteViews.switchTo('note');
        var noteTab = app.querySelector('.note-tab[data-ntab="note"]');
        if(noteTab && !noteTab.classList.contains("active")) noteTab.click();
      } else {
        var target = app.querySelector("#wpTasks") || app.querySelector(".wp-sections");
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      }
    });
  });
  /* 勾选与「全部完成自动标记本周」统一由上方「本周任务」处理 */

  /* 本周 Activity 导航：胶囊按钮点击直达对应 Activity（事件委托，避免内联 onclick 在闭包内失效） */
  Array.prototype.forEach.call(app.querySelectorAll(".act-chip"), function(btn){
    btn.addEventListener("click", function(){
      jumpToActivity(parseInt(btn.getAttribute("data-act"), 10));
    });
  });

  /* 笔记三标签切换 */
  Array.prototype.forEach.call(app.querySelectorAll(".note-tab[data-ntab]"), function(btn){
    btn.addEventListener("click", function(){
      var pane = btn.getAttribute("data-ntab");
      if(pane === "original"){
        ensureReadingData().then(function(){
          var reader = app.querySelector("iframe[data-original-src]");
          if(reader && course.originalTexts && typeof URL.createObjectURL === "function"){
            var book = bookOriginal(course, week);
            var source = book && book.file;
            var text = source && course.originalTexts[source.rel];
            if(typeof text === "string"){
              var key = course.id + "/" + source.rel;
              if(!originalTextUrls.has(key)){
                originalTextUrls.set(key, URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"})));
              }
              var url = originalTextUrls.get(key);
              reader.setAttribute("data-original-src", url);
              reader.parentNode.querySelector("a").href = url;

/* ---------- AI 助手面板 ---------- */
(function initAI(){
  var fab = document.getElementById("ai-fab");
  var panel = document.getElementById("ai-panel");
  if(!fab || !panel) return;
  var aiHistory = [];       // 本次对话的多轮上下文
  var current = null;       // { ctrl, bubble, got }
  aiReady();

  function routeShowsFab(){
    var h = location.hash;
    return h.indexOf("#/c/") === 0 || h.indexOf("#/read/") === 0 || h.indexOf("#/reading") === 0;
  }
  window.addEventListener("hashchange", function(){
    fab.style.display = routeShowsFab() ? "flex" : "none";
    panel.style.display = "none";
  });
  fab.addEventListener("click", function(){
    panel.style.display = "flex"; fab.style.display = "none";
    restoreGeom();
    if(!panel.dataset.placed) placePanel();
    document.getElementById("ai-hint").textContent = "当前页：" + (fab.getAttribute("data-ctx") || "课程周页");
  });
  document.getElementById("ai-close").addEventListener("click", function(){ panel.style.display = "none"; fab.style.display = "flex"; });
  document.getElementById("ai-clear").addEventListener("click", function(){
    aiHistory = []; document.getElementById("ai-log").innerHTML = "";
  });
  document.getElementById("ai-send").addEventListener("click", askAI);
  document.getElementById("ai-q").addEventListener("keydown", function(e){ if((e.ctrlKey||e.metaKey) && e.key === "Enter") askAI(); });

  /* 面板拖动 + 缩放（可移动、可放大；位置与大小会被记住） */
  var aiHead = panel.querySelector(".ai-head");
  var aiResizer = panel.querySelector(".ai-resizer");
  function persistGeom(){
    try{
      localStorage.setItem("cabin-ai-panel-geom", JSON.stringify({
        left: panel.offsetLeft, top: panel.offsetTop,
        width: panel.offsetWidth, height: panel.offsetHeight
      }));
    }catch(e){}
  }
  function restoreGeom(){
    try{
      var g = JSON.parse(localStorage.getItem("cabin-ai-panel-geom") || "null");
      if(g && typeof g.left === "number" && typeof g.top === "number"){
        panel.style.left = g.left + "px";
        panel.style.top = g.top + "px";
        panel.style.right = "auto";
        panel.style.bottom = "auto";
        if(g.width) panel.style.width = g.width + "px";
        if(g.height) panel.style.height = g.height + "px";
        panel.dataset.placed = "1";
      }
    }catch(e){}
  }
  function placePanel(){
    var r = panel.getBoundingClientRect();
    panel.style.left = r.left + "px";
    panel.style.top = r.top + "px";
    panel.style.right = "auto";
    panel.style.bottom = "auto";
    panel.dataset.placed = "1";
  }
  function clampPanel(){
    var maxL = Math.max(0, window.innerWidth - 60);
    var maxT = Math.max(0, window.innerHeight - 60);
    panel.style.left = Math.min(Math.max(0, panel.offsetLeft), maxL) + "px";
    panel.style.top = Math.min(Math.max(0, panel.offsetTop), maxT) + "px";
  }
  aiHead.addEventListener("mousedown", function(e){
    if(e.target.closest("button")) return;   // 标题栏上的按钮不触发拖动
    e.preventDefault();
    var r = panel.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sl = r.left, st = r.top, pw = r.width, ph = r.height;
    panel.style.right = "auto"; panel.style.bottom = "auto";
    function move(ev){
      var nl = Math.max(0, Math.min(sl + (ev.clientX - sx), window.innerWidth - pw));
      var nt = Math.max(0, Math.min(st + (ev.clientY - sy), window.innerHeight - ph));
      panel.style.left = nl + "px";
      panel.style.top = nt + "px";
    }
    function up(){
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      persistGeom();
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  aiResizer.addEventListener("mousedown", function(e){
    e.preventDefault(); e.stopPropagation();
    var r = panel.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    function move(ev){
      var nw = Math.max(300, Math.min(sw + (ev.clientX - sx), window.innerWidth - 16));
      var nh = Math.max(260, Math.min(sh + (ev.clientY - sy), window.innerHeight - 16));
      panel.style.width = nw + "px";
      panel.style.height = nh + "px";
    }
    function up(){
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      persistGeom();
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  window.addEventListener("resize", function(){
    if(panel.style.display === "none") return;
    if(panel.offsetWidth > window.innerWidth - 16) panel.style.width = (window.innerWidth - 16) + "px";
    if(panel.offsetHeight > window.innerHeight - 16) panel.style.height = (window.innerHeight - 16) + "px";
    clampPanel();
  });

  /* 探测云端模型是否可用 */
  function aiReady(){
    var tag = document.getElementById("ai-model");
    if(!window.cloudLLM){
      tag.textContent = "云端模型未就绪"; tag.style.color = "#f0b8b8";
      return;
    }
    window.cloudLLM.models().then(function(models){
      var m = (models || []).find(function(x){ return x.disabled !== true; });
      if(m){ tag.textContent = (m.name || m.id || "云端模型已接入"); tag.style.color = ""; }
      else { tag.textContent = "暂无可用模型"; tag.style.color = "#f0b8b8"; }
    }).catch(function(){
      tag.textContent = "云端模型暂不可用"; tag.style.color = "#f0b8b8";
    });
  }

  function addMsg(cls, txt){
    var log = document.getElementById("ai-log");
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = txt;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function askAI(){
    var qEl = document.getElementById("ai-q");
    var btn = document.getElementById("ai-send");
    var q = qEl.value.trim();
    if(current){ current.ctrl.abort(); return; }   // 生成中再点 = 停止
    if(!q) return;
    qEl.value = "";
    addMsg("q", q);
    var bubble = addMsg("a", "");
    bubble.classList.add("streaming");
    var ctrl = new AbortController();
    current = { ctrl: ctrl, bubble: bubble, question: q };
    btn.textContent = "停止";
    btn.classList.add("stopping");

    if(!window.cloudLLM){
      bubble.className = "msg err";
      bubble.textContent = "⚠ 云端模型未就绪，请确认已联网并打开本站。";
      done();
      return;
    }
    var ctx = document.getElementById("ai-fab").getAttribute("data-ctx") || "";
    var sysContent = "你是「学习小屋」的 AI 学习助手，陪伴 Liora 学习新南威尔士大学预科课程（会计 / 经济 / 数学 / 计算机 / 英语）。" +
      "用中文回答，语气耐心、专业、简洁；涉及计算或概念时给出关键步骤；不知道就说不知道，不要编造。" +
      (ctx ? "\n\n当前页面上下文：\n" + ctx : "");
    var messages = [{ role: "system", content: sysContent }];
    aiHistory.forEach(function(h){ messages.push({ role: h.role, content: h.content }); });
    messages.push({ role: "user", content: q });

    window.cloudLLM.stream(messages, {
      signal: ctrl.signal,
      temperature: 0.6,
      onDelta: function(t){
        if(current && current.bubble){
          current.bubble.textContent += t;
          var log = document.getElementById("ai-log");
          if(log) log.scrollTop = log.scrollHeight;
        }
      }
    }).then(function(answer){
      finish(answer, false, q);
    }).catch(function(e){
      if(e && e.name === "AbortError"){ finish(null, true); return; }
      bubble.className = "msg err";
      bubble.textContent = "⚠ " + window.cloudLLM.errorText(e);
      done();
    });
  }

  /* 读取流式回答（OpenAI 兼容 SSE） */
  function pump(res){
    var reader = res.body.getReader();
    var dec = new TextDecoder("utf-8");
    var buf = "", answer = "";
    function handleLine(line){
      if(!line || line.indexOf("data:") !== 0) return;
      var data = line.slice(5).trim();
      if(data === "[DONE]") return;
      var chunk;
      try { chunk = JSON.parse(data); } catch(err){ return; }
      var delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
      if(delta && delta.content){
        answer += delta.content;
        if(current && current.bubble){
          current.bubble.textContent = answer;
          var log = document.getElementById("ai-log");
          log.scrollTop = log.scrollHeight;
        }
      }
    }
    function loop(){
      return reader.read().then(function(r){
        if(r.done) return answer;
        buf += dec.decode(r.value, { stream: true });
        var parts = buf.split("\n");
        buf = parts.pop();
        parts.forEach(handleLine);
        return loop();
      });
    }
    return loop();
  }

  function finish(answer, aborted, question){
    if(current && current.bubble){
      current.bubble.classList.remove("streaming");
      if(aborted){
        if(!current.bubble.textContent.trim()) current.bubble.textContent = "（已停止）";
      } else if(answer){
        aiHistory.push({ role: "user", content: question });
        aiHistory.push({ role: "assistant", content: answer });
        if(aiHistory.length > 12) aiHistory = aiHistory.slice(-12);
      }
    }
    done();
  }

  function done(){
    var btn = document.getElementById("ai-send");
    btn.disabled = false; btn.textContent = "提问";
    btn.classList.remove("stopping");
    current = null;
  }

  function friendlyError(msg){
    if(/ai_config|api_key|缺少/.test(msg)) return "本机还没有配置模型密钥：请检查 网站\\ai_config.json 是否存在且填了 base_url / api_key / model。";
    if(/未启动|Failed to fetch|NetworkError|Network request/.test(msg)) return "没有连到本地服务器：请双击 open_cabin_ai.bat 启动，不要直接双击 index.html（直接双击网页时浏览器不让页面调用本机服务）。";
    if(/401|403|auth/i.test(msg)) return "模型密钥无效或已过期，需要更新 ai_config.json 里的 api_key。";
    if(/429|quota|rate/i.test(msg)) return "请求太频繁或额度用完了，稍等一会儿再试。";
    if(/HTTP 5\d\d|gateway|model_/i.test(msg)) return "模型服务暂时不可用，稍后再试一次。";
    return msg + "（若反复失败，把这段话发给我，我来排错）";
  }
})();

function copyText(text, btn){
  function done(){
    if(!btn) return;
    btn.classList.add("copied");
    btn.textContent = "✓ 已复制";
    setTimeout(function(){ btn.classList.remove("copied"); btn.textContent = "复制"; }, 1800);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
}

            items.push({f:f, w:w, t:t});
          }
        });
      });
    });
    if(!items.length) return;
    rows += '<tr><td class="a-course"><span class="cc-dot" style="background:'+c.color+'"></span>'+esc(c.nameCn)+'</td><td>';
    items.forEach(function(it){
      rows += '<a href="'+fileHref(c,it.f)+'" target="_blank" rel="noopener" style="display:block;padding:2px 0">'+esc(it.f.name)+' <span style="color:var(--muted);font-size:11.5px">('+esc(ROLE_LABEL[it.f.role]||"")+' · W'+it.w.num+')</span></a>';
    });
    rows += '</td></tr>';
  });
  if(rows){
    html += '<table class="assess-table"><thead><tr><th style="width:180px">课程</th><th>可批改 / 可练习的文件（点击打开）</th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else {
    html += '<div class="empty-hint">暂未收录考核类文件。</div>';
  }
  html += '</section></div>';
  app.innerHTML = html;

  /* interactive step cards */
  Array.prototype.forEach.call(app.querySelectorAll(".step[data-step]"), function(el){
    el.addEventListener("click", function(ev){
      if(ev.target.closest(".copy-btn") || ev.target.closest(".scroll-link") || ev.target.closest("[data-nav]")) return;
      el.classList.toggle("open");
    });
    el.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" || ev.key === " "){
        ev.preventDefault();
        el.classList.toggle("open");
      }
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll(".copy-btn"), function(btn){
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      copyText(btn.getAttribute("data-copy") || "", btn);
    });
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-scroll]"), function(btn){
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      ev.preventDefault();
      var target = document.getElementById(btn.getAttribute("data-scroll"));
      if(target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  /* 直接提交工作台 */
  bindWorkbench();
}

/* ---------- 提交工作台：选课程→填名称→拖文件/粘贴文字→提交→AI 分析→自动入档案 ---------- */
var SUBMIT_FILES = [];
function bindWorkbench(){
  var drop = document.getElementById("subDrop");
  var fileInput = document.getElementById("subFiles");
  var list = document.getElementById("subFileList");
  var go = document.getElementById("subGo");
  var logOnly = document.getElementById("subLogOnly");
  if(!drop || !go) return;

  /* 点击选择 / 拖放 */
  drop.addEventListener("click", function(ev){ if(ev.target.tagName !== "I") fileInput.click(); });
  drop.addEventListener("dragover", function(ev){ ev.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", function(){ drop.classList.remove("drag"); });
  drop.addEventListener("drop", function(ev){
    ev.preventDefault(); drop.classList.remove("drag");
    var files = ev.dataTransfer && ev.dataTransfer.files ? Array.prototype.slice.call(ev.dataTransfer.files) : [];
    addFiles(files);
  });
  fileInput.addEventListener("change", function(){ addFiles(Array.prototype.slice.call(fileInput.files || [])); fileInput.value = ""; });

  function addFiles(files){
    files.forEach(function(f){ SUBMIT_FILES.push(f); });
    renderFiles();
  }
  function renderFiles(){
    if(!list) return;
    list.innerHTML = SUBMIT_FILES.map(function(f, i){
      return '<span class="dz-file">📎 '+esc(f.name)+' <i data-rmfile="'+i+'" title="移除">✕</i></span>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll("[data-rmfile]"), function(x){
      x.addEventListener("click", function(ev){
        ev.stopPropagation();
        SUBMIT_FILES.splice(parseInt(x.getAttribute("data-rmfile"),10),1);
        renderFiles();
      });
    });
  }

  function readText(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){
        var b = String(reader.result || "");
        /* 只取可读文本，限制长度 */
                var clean = b.replace(/[\x00-\x1f\x7f]+/g, " ").replace(/\s+/g, " ").trim();
        resolve(clean.slice(0, 12000));
      };
      reader.onerror = function(){ resolve(""); };
      reader.readAsText(file);
    });
  }

  function baseRecord(analysis){
    var cid = document.getElementById("subCourse").value;
    var week = parseInt(document.getElementById("subWeek").value,10) || null;
    var title = (document.getElementById("subTitle").value || "").trim();
    var type = document.getElementById("subType").value;
    return {
      id: "sub_" + Date.now() + "_" + Math.floor(Math.random()*1e4),
      date: new Date().toISOString().slice(0,10),
      courseId: cid,
      weekNum: week,
      type: type,
      title: title,
      score: (analysis && typeof analysis.score === "number" && !isNaN(analysis.score)) ? analysis.score : null,
      weakPoints: (analysis && Array.isArray(analysis.weakPoints)) ? analysis.weakPoints : [],
      note: (analysis && analysis.summary) ? ("AI：" + analysis.summary.slice(0,200)) : "",
      aiAnalyzed: true
    };
  }

  function showResult(rec){
    var box = document.getElementById("subResult");
    if(!box) return;
    var hasScore = typeof rec.score === "number";
    box.innerHTML =
      '<div class="sr-head"><b>✓ 已记入学习档案</b>' +
      (hasScore ? '<span class="sr-score">'+rec.score+'<small> 分</small></span>' : '<span style="font-size:12px;color:var(--muted)">未评分 · 按掌握度记录</span></div>') +
      (rec.weakPoints && rec.weakPoints.length ? '<div class="sr-weak">'+rec.weakPoints.map(function(w){ return '<span class="tag">'+esc(w)+'</span>'; }).join("")+'</div>' : "") +
      (rec.note ? '<div class="sr-body">'+esc(rec.note)+'</div>' : "") +
      '<div class="sr-foot">可在「学习档案」页查看趋势与薄弱点统计。<a href="#/profile" data-nav="#/profile" style="color:var(--blue);font-weight:600">查看档案 →</a></div>';
    box.classList.add("show");
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function doLogOnly(){
    var rec = baseRecord(null);
    if(!rec.title){ alert("请填写作业/考试名称"); return; }
    saveRecords(loadRecords().concat([rec]));
    showResult(rec);
  }

  function doSubmit(){
    var title = (document.getElementById("subTitle").value || "").trim();
    if(!title){ alert("请填写作业/考试名称（必填）"); return; }
    if(!SUBMIT_FILES.length && !document.getElementById("subText").value.trim()){
      alert("请至少提交一项：拖放文件，或粘贴文字。"); return;
    }
    go.disabled = true; go.textContent = "AI 分析中…";
    var ctx = SUBMIT_FILES.map(function(f){ return "【文件 " + f.name + "】"; }).join(" ") +
      "【粘贴文字】\n" + document.getElementById("subText").value;
    var question = "请批改并解析这份「" + title + "」作业（" + typeLabel(document.getElementById("subType").value) + "）。" +
      (SUBMIT_FILES.length ? "学生提交的文件内容如下：\n" : "") +
      ctx +
      "\n要求：①逐题判定对错并指出错误原因；②对薄弱知识点打标签；③若学生提供了正确/总题数或分数，换算成 0-100 的得分率；若没有分数，score 填 null；④最后用一句话总结。" +
      "请严格按以下 JSON 回复，不要其他内容：{\"score\":数字或null,\"weakPoints\":[\"薄弱点1\",\"薄弱点2\"],\"summary\":\"一句话总结\"}";
    /* 无 fetch 环境（如本地 file:// 或 jsdom）直接走「仅记录」路径，不报错 */
    if(typeof fetch === "undefined"){
      var rec0 = baseRecord({ summary: "未连接 AI 服务，本次仅记录提交，未评分。" });
      saveRecords(loadRecords().concat([rec0]));
      showResult(rec0);
      go.disabled = false; go.textContent = "提交并让 AI 分析";
      SUBMIT_FILES = []; renderFiles();
      return;
    }
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question, context: "课程上下文：" + (courseOf(document.getElementById("subCourse").value) ? courseOf(document.getElementById("subCourse").value).nameCn : "") + "；" + title })
    })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      var analysis = { score: null, weakPoints: [], summary: j.ok ? j.answer : (j.error || "AI 不可用") };
      if(j.ok && j.answer){
        var m = j.answer.match(/\{[\s\S]*\}/);
        if(m){
          try{
            var parsed = JSON.parse(m[0]);
            if(typeof parsed.score === "number" && parsed.score >= 0 && parsed.score <= 100) analysis.score = Math.round(parsed.score);
            else if(parsed.score === null) analysis.score = null;
            if(Array.isArray(parsed.weakPoints)) analysis.weakPoints = parsed.weakPoints.slice(0,8).map(String);
            if(parsed.summary) analysis.summary = String(parsed.summary).slice(0,300);
          }catch(e){ /* 保留原始 summary */ }
        }
      }
      var rec = baseRecord(analysis);
      saveRecords(loadRecords().concat([rec]));
      showResult(rec);
    })
    .catch(function(e){
      var rec = baseRecord({ summary: "AI 服务暂不可用（" + e.message + "），本次仅记录提交，未评分。" });
      saveRecords(loadRecords().concat([rec]));
      showResult(rec);
    })
    .then(function(){
      go.disabled = false; go.textContent = "提交并让 AI 分析";
      SUBMIT_FILES = []; renderFiles();
    });
  }

  go.addEventListener("click", doSubmit);
  if(logOnly) logOnly.addEventListener("click", doLogOnly);
}

/* ---------- learning archive (records) ---------- */
var REC_KEY = "xinnan-portal-records-v1";
var profileFilter = { course: "ALL", weak: null };
var armedDelete = null;

function loadRecords(){
  var recs = [];
  try{ recs = JSON.parse(localStorage.getItem(REC_KEY)) || []; }catch(e){ recs = []; }
  if(!Array.isArray(recs)) recs = [];
  if(window.PORTAL_RECORDS && Array.isArray(window.PORTAL_RECORDS)){
    var ids = {};
    recs.forEach(function(r){ if(r && r.id) ids[r.id] = 1; });
    window.PORTAL_RECORDS.forEach(function(r){
      if(r && r.id && !ids[r.id]){ recs.push(r); ids[r.id] = 1; }
    });
  }
  recs = recs.filter(function(r){ return r && r.date; });
  recs.sort(function(a,b){ return (a.date < b.date ? -1 : (a.date > b.date ? 1 : 0)); });
  return recs;
}
function saveRecords(recs){
  try{ localStorage.setItem(REC_KEY, JSON.stringify(recs)); }catch(e){}
}
function courseOf(id){ return findCourse(id); }
function scoreClass(s){ return s >= 85 ? "good" : (s >= 60 ? "mid" : "low"); }
function typeLabel(t){ return t === "exam" ? "考试" : (t === "quiz" ? "测验" : "练习"); }

function aggWeakPoints(recs){
  var map = {};
  recs.forEach(function(r){
    (r.weakPoints || []).forEach(function(w){
      w = String(w).trim();
      if(!w) return;
      if(!map[w]) map[w] = { count: 0, courses: {} };
      map[w].count++;
      map[w].courses[r.courseId] = 1;
    });
  });
  var arr = Object.keys(map).map(function(k){ return { name: k, count: map[k].count, courses: Object.keys(map[k].courses) }; });
  arr.sort(function(a,b){ return b.count - a.count; });
  return arr;
}

function trendSvg(recs){
  var pts = recs.filter(function(r){ return typeof r.score === "number"; });
  if(pts.length < 2){
    return '<div class="empty-hint" style="padding:14px">记录 2 次以上成绩后，这里会显示得分趋势图。</div>';
  }
  var W = 640, H = 130, P = 26;
  function y(v){ return H - P - (v / 100) * (H - P * 2); }
  var stepX = (W - P * 2) / (pts.length - 1);
  var coords = pts.map(function(r, i){ return { x: P + i * stepX, y: y(r.score), r: r }; });
  var path = coords.map(function(c, i){ return (i ? "L" : "M") + c.x.toFixed(1) + " " + c.y.toFixed(1); }).join(" ");
  var dots = coords.map(function(c){
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="3.2" fill="#c9a227" stroke="#0b2545" stroke-width="1"><title>' +
      esc(c.r.date + " " + c.r.title + " · " + c.r.score + " 分") + '</title></circle>';
  }).join("");
  var grid = "";
  [50, 100].forEach(function(v){
    grid += '<line x1="' + P + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - P) + '" y2="' + y(v).toFixed(1) + '" stroke="#e9edf3" stroke-dasharray="4 4"/>' +
      '<text x="' + (P - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#68788c">' + v + '</text>';
  });
  return '<svg class="trend-svg" viewBox="0 0 ' + W + ' ' + H + '">' + grid +
    '<path d="' + path + '" fill="none" stroke="#13315c" stroke-width="2" stroke-linejoin="round"/>' + dots + '</svg>' +
    '<div class="trend-legend"><span><i style="background:#13315c"></i>得分率走势</span><span><i style="background:#c9a227"></i>每次提交（悬停查看详情）</span></div>';
}

  var pgExp = document.getElementById("pgExport");

        renderProfile();
      }catch(e){ alert("导入失败：文件格式不正确"); }
    };
    reader.readAsText(f);
    pgImp.value = "";
  });

  var clrBtn = document.getElementById("rfClear");
  if(clrBtn) clrBtn.addEventListener("click", function(){
    if(armedDelete !== "__clear__"){
      armedDelete = "__clear__";
      clrBtn.classList.add("armed");

      return;
    }
    saveRecords([]);
    armedDelete = null;
    profileFilter = { course: "ALL", weak: null };
    renderProfile();
  });
}

/* ---------- router ---------- */
function bookOriginal(course, week){
  var originalUrl = "";
  var source;
  if(course.reading){
    source = (week.files || []).find(function(f){ return f.ext === "pdf" || f.ext === "txt"; });
    var noteHtml = week.graphicHtml || "";
    if(source){
      originalUrl = fileHref(course, source);
      var page = /[.]pdf#page=(\d+)/.exec(noteHtml);
      if(page && source.ext === "pdf") originalUrl += "#page=" + page[1];
    } else {
      var online = /href="(https:\/\/www[.]gutenberg[.]org\/[^"]+)"/.exec(noteHtml);
      if(online) originalUrl = online[1];
    }
  }
  return {url:originalUrl, file:source};
}

function bindBookAnnotations(courseId, page, text, chapterStart, visibleStart, visibleEnd){
  var key = "cabin-book-annotations/" + courseId;
  var entries = [];
  try{ var saved = JSON.parse(localStorage.getItem(key) || "[]"); if(Array.isArray(saved)) entries = saved; }catch(e){}
  var body = page.querySelector(".book-original-text");

  /* 浮动工具条与气泡（全局只建一次，挂到 body 下，避免随页面重渲染而重复创建） */
  var toolbar = document.getElementById("hl-toolbar");
  if(!toolbar){
    toolbar = document.createElement("div");
    toolbar.id = "hl-toolbar";
    toolbar.className = "hl-toolbar";
    toolbar.innerHTML = '<button type="button" data-act="hl">✏️ 高亮</button>'+
      '<button type="button" data-act="note">📝 笔记</button>'+
      '<button type="button" class="ask" data-act="ask">🤖 问AI</button>';
    document.body.appendChild(toolbar);
  }
  var pop = document.getElementById("hl-pop");
  if(!pop){
    pop = document.createElement("div");
    pop.id = "hl-pop";
    pop.className = "hl-pop";
    document.body.appendChild(pop);
  }

  function save(updated){
    try{ localStorage.setItem(key, JSON.stringify(updated)); }
    catch(e){ return false; }
    entries = updated; draw(); return true;
  }
  function readSelection(){
    if(!body) return null;
    var selection = window.getSelection();
    if(!selection || selection.isCollapsed || !selection.rangeCount) return null;
    var range = selection.getRangeAt(0);
    if(!body.contains(range.startContainer) || !body.contains(range.endContainer)) return null;
    var prefix = document.createRange();
    prefix.selectNodeContents(body);
    prefix.setEnd(range.startContainer, range.startOffset);
    var start = prefix.toString().length + Math.max(0, visibleStart || 0);
    var quote = range.toString().trim();
    if(!quote) return null;
    return { start:start, end:start+quote.length, quote:quote };
  }
  function draw(){
    if(body){
      var first = Math.max(0, visibleStart || 0);
      var last = Number.isInteger(visibleEnd) ? visibleEnd : text.length;
      var points = [first, last];
      var pageLabels = new Map();
      for(var match of text.matchAll(/〔原书第 \d+ 页〕[\u200b \t]*(?:\n|$)?/g)){
        if(match.index < first || match.index >= last) continue;
        var end = Math.min(last, match.index + match[0].length);
        pageLabels.set(match.index,end);
        points.push(match.index,end);
      }
      if(chapterStart >= first && chapterStart < last) points.push(chapterStart);
      entries.forEach(function(entry){
        if(Number.isInteger(entry.start) && entry.start >= 0 && entry.end <= text.length && entry.end > entry.start){
          if(entry.end > first && entry.start < last) points.push(Math.max(first, entry.start), Math.min(last,entry.end));
        }
      });
      points = Array.from(new Set(points)).sort(function(a,b){ return a-b; });
      var labelEnd = -1;
      points = points.filter(function(point){
        if(point < labelEnd) return false;
        if(pageLabels.has(point)) labelEnd = pageLabels.get(point);
        return true;
      });
      var fragment = document.createDocumentFragment();
      points.slice(1).forEach(function(end, i){
        var start = points[i];
        if(start === chapterStart){
          var anchor = document.createElement("span");
          anchor.id = "book-chapter-start";
          fragment.appendChild(anchor);
        }
        var value = text.slice(start, end);
        if(pageLabels.has(start)){
          var label = document.createElement("span");
          label.hidden = true;
          label.textContent = value;
          fragment.appendChild(label);
        } else {
          var hit = entries.find(function(entry){ return entry.start <= start && entry.end >= end; });
          if(hit){
            var idx = entries.indexOf(hit);
            var mark = document.createElement("mark");
            mark.textContent = value;
            if(hit.note){ mark.className = "hl-note"; mark.setAttribute("data-idx", String(idx)); }
            fragment.appendChild(mark);
          } else fragment.appendChild(document.createTextNode(value));
        }
      });
      body.replaceChildren(fragment);
    }

/* 读书专属数据（pdfEngine / originalTexts / renderedPages，约 30MB）已拆到 reading-data.js，按需懒加载。
   首页与其它课程页完全不需要这些数据，从而把主 data.js 从 ~33MB 降到 ~3MB，开门快很多。 */
var lazyScripts = {};
function loadOptionalScript(src){
  if(lazyScripts[src]) return lazyScripts[src];
  lazyScripts[src] = new Promise(function(resolve,reject){
    var script=document.createElement('script'); script.src=src;
    script.onload=resolve;
    script.onerror=function(){ delete lazyScripts[src]; script.remove(); reject(new Error('资源加载失败，请重试')); };
    document.head.appendChild(script);
  });
  return lazyScripts[src];
}
var readingDataPromise = null;
function applyReadingData(){
  var d = window.READING_DATA; if(!d || !DATA || !DATA.courses) return;
  if(d.pdfEngine) DATA.pdfEngine = d.pdfEngine;
  var translatedBook = DATA.courses.find(function(course){ return course.id === "guofulun"; });
  if(translatedBook && window.GUOFULUN_TRANSLATION_VERSIONS){
    translatedBook.readingVersions = window.GUOFULUN_TRANSLATION_VERSIONS;
  }
  var cd = d.courses || {};
  for(var i=0;i<DATA.courses.length;i++){
    var c = DATA.courses[i], r = cd[c.id];
    if(r){
      if(r.originalTexts) c.originalTexts = r.originalTexts;
      if(r.readingVersions) c.readingVersions = r.readingVersions;
      if(r.renderedPages) c.renderedPages = r.renderedPages;
    }
  }
}
function ensureReadingData(){
  if(readingDataPromise) return readingDataPromise;
  readingDataPromise = Promise.all([
    window.READING_DATA ? Promise.resolve() : loadOptionalScript('reading-data.js?v=20261108-pages1'),
    window.GUOFULUN_TRANSLATION_VERSIONS ? Promise.resolve() : loadOptionalScript('guofulun-translations.js?v=chapter11-part3-sort3')
  ]).then(function(){ applyReadingData(); }).catch(function(error){ readingDataPromise=null; throw error; });
  return readingDataPromise;
}

var pdfEnginePromise;
function localPdfEngine(){
  if(!pdfEnginePromise){
    var engine = DATA.pdfEngine;
    if(!engine) return Promise.reject(new Error("Missing PDF engine"));
    var moduleUrl = URL.createObjectURL(new Blob([engine.module],{type:"text/javascript"}));
    pdfEnginePromise = import(moduleUrl).then(function(pdfjs){
      pdfjs.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([engine.worker],{type:"text/javascript"}));
      return pdfjs;
    }).finally(function(){ URL.revokeObjectURL(moduleUrl); });
  }
  return pdfEnginePromise;
}
var closePdfReader = null;
async function openPdfReader(reader, url, courseId){
  var closed = false;
  var loading;
  var resizeObserver;
  try{ await ensureReadingData(); }catch(e){ /* 仍在渲染，下面取数时会给出提示 */ }
  closePdfReader = function(){
    if(resizeObserver) resizeObserver.disconnect();
    closed = true;
    if(loading) loading.destroy().catch(function(){});
  };
  var status = reader.querySelector("[role=status]");
  var input = reader.querySelector("input");
  var zoom = reader.querySelector("select");
  var paper = reader.querySelector(".pdf-paper");
  var previous = reader.querySelector("[data-turn='-1']");
  var next = reader.querySelector("[data-turn='1']");
  var key = "cabin-pdf-page/" + courseId;
  var zoomKey = "cabin-pdf-zoom/" + courseId;
  try{
    var savedZoom = localStorage.getItem(zoomKey);
    if(Array.from(zoom.options).some(function(option){ return option.value === savedZoom; })) zoom.value = savedZoom;
  }catch(e){}
  var pageNum = Number((/#page=(\d+)/.exec(url) || [])[1]) || 0;
  try{ if(!pageNum) pageNum = Number(localStorage.getItem(key)) || 1; }catch(e){ pageNum = pageNum || 1; }
  var revision = 0;
  try{
    var images = findCourse(courseId).renderedPages;
    var pdf;
    if(!images){
      var pdfjs = await localPdfEngine();
      if(closed) return;
      loading = pdfjs.getDocument({
        url:url.split("#")[0],
        cMapPacked:true,
        useWorkerFetch:false,
        BinaryDataFactory:class {
          async fetch(request){
            var encoded = DATA.pdfEngine.assets[request.kind]?.[request.filename];
            if(!encoded) throw new Error("Missing PDF resource: " + request.filename);
            return Uint8Array.from(atob(encoded), function(ch){ return ch.charCodeAt(0); });
          }
        }
      });
      var timeout;
      try{
        pdf = await Promise.race([loading.promise,new Promise(function(resolve,reject){
          timeout = setTimeout(function(){ reject(new Error("PDF load timeout")); },15000);
        })]);
      }finally{ clearTimeout(timeout); }
    }
    var total = images ? images.length : pdf.numPages;
    if(closed) return;
    reader.querySelector("fieldset").disabled = false;
    reader.querySelector(".pdf-total").textContent = "/ " + total;
    input.max = total;
    async function show(requested, preserveScroll){
      var job = ++revision;
      pageNum = Math.max(1,Math.min(total,Math.trunc(requested) || pageNum));
      var number = pageNum;
      input.value = number;
      previous.disabled = number === 1;
      next.disabled = number === total;
      status.textContent = "正在加载第 " + number + " 页…";
      try{
        var canvas;
        if(images){
          canvas = new Image();
          canvas.alt = "第 " + number + " 页";
          canvas.style.cssText = "display:block;margin:0 auto;background:white";
          var pageSrc = String(images[number-1] || "");
          /* 老数据是 base64 内嵌；2026-11-08 起整页书影抽成了 reading/<book>/pNNN.webp 独立文件 */
          canvas.src = /^(data:|https?:|\/|\.{0,2}\/|[\w-]+\/)/.test(pageSrc) ? pageSrc : "data:image/jpeg;base64," + pageSrc;
          await canvas.decode();
          var width = Math.max(180,paper.clientWidth - 24);
          var height = Math.max(180,paper.clientHeight - 24);
          var fit = Math.min(width, height * canvas.naturalWidth / canvas.naturalHeight);
          canvas.style.width = (zoom.value === "width" ? width : Math.min(width,fit * Number(zoom.value))) + "px";
        } else {
        var page = await pdf.getPage(number);
        if(closed || job !== revision) return;
        var natural = page.getViewport({scale:1});
        var fitWidth = Math.max(180,paper.clientWidth - 24) / natural.width;
        var fitPage = Math.min(fitWidth, Math.max(180,paper.clientHeight - 24) / natural.height);
        var scale = zoom.value === "width" ? fitWidth : Math.min(fitWidth,fitPage * Number(zoom.value));
        var viewport = page.getViewport({scale:scale});
        var ratio = Math.min(window.devicePixelRatio || 1,2);
        canvas = document.createElement("canvas");
        canvas.setAttribute("aria-label","第 " + number + " 页");
        canvas.width = Math.ceil(viewport.width * ratio);
        canvas.height = Math.ceil(viewport.height * ratio);
        canvas.style.width = viewport.width + "px";
        await page.render({canvasContext:canvas.getContext("2d"),viewport:viewport,transform:[ratio,0,0,ratio,0,0]}).promise;
        }
        if(closed || job !== revision) return;
        paper.replaceChildren(canvas);
        if(!preserveScroll) paper.scrollTop = 0;
        status.textContent = "";
        try{ localStorage.setItem(key,String(number)); }catch(e){}
      }catch(e){ if(!closed && job === revision) status.textContent = "这页加载失败，可重试或打开原版 PDF。"; }
    }
    previous.addEventListener("click",function(){ show(pageNum-1); });
    next.addEventListener("click",function(){ show(pageNum+1); });
    input.addEventListener("change",function(){ show(Number(input.value)); });
    zoom.addEventListener("change",function(){
      try{ localStorage.setItem(zoomKey,zoom.value); }catch(e){}
      show(pageNum);
    });
    paper.addEventListener("keydown",function(event){
      if(event.key === "ArrowLeft" || event.key === "ArrowRight"){
        event.preventDefault();
        show(pageNum + (event.key === "ArrowLeft" ? -1 : 1));
      }
    });
    if(typeof ResizeObserver === "function"){
      var lastWidth = paper.clientWidth;
      var lastHeight = paper.clientHeight;
      resizeObserver = new ResizeObserver(function(){
        if(paper.clientWidth === lastWidth && paper.clientHeight === lastHeight) return;
        lastWidth = paper.clientWidth;
        lastHeight = paper.clientHeight;
        show(pageNum, true);
      });
      resizeObserver.observe(paper);
    }
    show(pageNum);
  }catch(e){
    if(loading && !closed) loading.destroy().catch(function(){});
    if(!closed) status.textContent = "阅读器未能打开这本书。可以刷新重试，或点击下方打开原版 PDF。";
  }
}

function bookChapterRange(course, chapter, text){
  if(typeof text !== "string") return null;
  if(course.id === "xiaodao"){
    var headings = Array.from(text.matchAll(/^第[一二三四五六七八九十]+章[ \t　]*$/gm));
    if(chapter.num <= 19 && headings[chapter.num-1]){
      return {start:headings[chapter.num-1].index,end:headings[chapter.num]?.index ?? text.length};
    }
  }
  if(course.id === "richdad"){
    var pages = chapter.graphicHtml.match(/第 (\d+)[–—-](\d+) 页/);
    if(pages){
      var first = text.indexOf("〔原书第 "+pages[1]+" 页〕");
      var last = text.indexOf("〔原书第 "+(Number(pages[2])+1)+" 页〕",first);
      if(first >= 0) return {start:first,end:last >= 0 ? last : text.length};
    }
  }
  return null;
}

function renderBookPage(courseId, termId, chapterNum, preferPdf){
  var course = findCourse(courseId);
  var term = course && course.reading && course.terms.find(function(t){ return t.id === termId; });
  var index = term ? term.weeks.findIndex(function(w){ return w.num === chapterNum; }) : -1;
  if(index < 0){ renderReading(); return; }
  var chapter = term.weeks[index];
  var bookPath = esc(course.id) + '/' + esc(term.id) + '/';
  var sizeOptions = [["small","小",1],["medium","中",1.18],["large","大",1.45]];
  var size = "medium";
  try{ size = localStorage.getItem("cabin-book-size") || size; }catch(e){}

  });
  controls += '</div>';
  var original = bookOriginal(course, chapter);
  var text = original.file && course.originalTexts && course.originalTexts[original.file.rel];
  var versions = {};
  Object.keys(course.originalTexts || {}).forEach(function(rel){
    var value = course.originalTexts[rel];
    var sample = value.slice(0,20000);
    var lang = (sample.match(/[\u3400-\u9fff]/g) || []).length > 100 ? "zh" : "en";
    if(!versions[lang]) versions[lang] = value;
  });
  Object.keys(course.readingVersions || {}).forEach(function(lang){
    var version = course.readingVersions[lang];
    if(!version.partial || (version.ranges && version.ranges[chapter.num])){
      versions[lang] = version.text;
    }
  });
  var originalLanguage = ["richdad","xiaodao","htlb"].indexOf(course.id) >= 0 ? "zh" : "en";
  var language = originalLanguage;
  try{ language = localStorage.getItem("cabin-reading-language/"+course.id) || language; }catch(e){}
  if(!versions[language]) language = originalLanguage;
  if(versions[language]) text = versions[language];
  var languagePicker = '<label class="reading-language">正文语言<select aria-label="正文语言" data-reading-language>'+
    ["zh","en"].map(function(lang){
      var available = Boolean(versions[lang]) || lang === originalLanguage;
      return '<option value="'+lang+'"'+(lang === language ? ' selected' : '')+(available ? '' : ' disabled')+'>'+
        (lang === "zh" ? "中文" : "English")+(available && course.readingVersions?.[lang]?.aiTranslation ? "（AI 翻译）" : "")+(available ? "" : "（待收录）")+'</option>';
    }).join("")+'</select></label>';

  var isPdf = original.file && original.file.ext === "pdf";
  var hasText = typeof text === "string" && (!isPdf || !preferPdf);
  var edition = (course.readingVersions || {})[language];
  var chapterRange = edition && edition.ranges ? edition.ranges[chapter.num] : bookChapterRange(course,chapter,text);
  if(edition && edition.ranges && !chapterRange && chapter.displayLabel){
    chapterRange = {start:0,end:0};
  }
  var chapterStart = chapterRange ? chapterRange.start : -1;
  if(typeof text === "string" && course.id === "xiaodao" && chapter.num <= 19){
    var numerals = "一二三四五六七八九";
    var num = chapter.num;
    var heading = "第" + (num >= 10 ? "十" : "") + (num === 10 ? "" : numerals[(num - 1) % 10]) + "章";
    var match = new RegExp("^" + heading + "[ \t　]*$", "m").exec(text);
    if(match) chapterStart = match.index;
  }
  /* 「导读」「全书回顾」等带 displayLabel 的章节是学习小屋整理的导引，原书里没有对应正文。
     阅读器翻页和目录只走有正文的章节；直接打开导引章时说明情况，不显示空白页。 */
  function chapterHasText(item){
    if(!item.displayLabel) return true;
    var r = edition && edition.ranges ? edition.ranges[item.num] : bookChapterRange(course, item, text);
    return Boolean(r && r.end > r.start);
  }
  var readerWeeks = hasText ? term.weeks.filter(chapterHasText) : term.weeks;
  if(hasText && readerWeeks.indexOf(chapter) < 0){

    app.innerHTML = '<main class="container"><nav class="book-reading-nav" aria-label="阅读入口">' +
      '<a class="note-tab" href="#/reading">书架</a><a class="note-tab" href="#/c/'+bookPath+chapter.num+'">打开这一章的笔记</a></nav>' +
      '<article class="gx book-reading-page"><p class="book-reading-caption">'+esc(chapter.displayLabel)+'</p><h2>'+esc(chapter.title)+'</h2>' +
      '<p>「'+esc(chapter.displayLabel)+'」是学习小屋为《'+esc(course.nameCn)+'》整理的阅读导引，原书里没有对应的正文，内容都在这一章的笔记里。</p>' +
      (firstText ? '<nav class="book-reading-nav" aria-label="章节翻页"><a class="note-tab" href="#/read/'+bookPath+firstText.num+'">从正文第一章读起 →</a></nav>' : '') +
      '</article></main>';
    var guideFab = document.getElementById("ai-fab");
    if(guideFab){ guideFab.style.display = "flex"; guideFab.setAttribute("data-ctx", "书籍：" + (course.nameCn||course.name) + "；本章：" + (chapter.title||"") + "（导引章，无原书正文）"); }
    return;
  }
  var readerIndex = readerWeeks.indexOf(chapter);
  if(isPdf && !hasText && course.illustratedPdf && typeof URL.createObjectURL === "function"){
    var key = course.id + "/illustrated-pdf";
    if(!originalTextUrls.has(key)){
      var bytes = Uint8Array.from(atob(course.illustratedPdf), function(ch){ return ch.charCodeAt(0); });
      originalTextUrls.set(key, URL.createObjectURL(new Blob([bytes], {type:"application/pdf"})));
    }
    var pageMarker = chapterStart >= 0 && /〔原书第 (\d+) 页〕[^〔]*$/.exec(text.slice(0,chapterStart));
    var fragment = original.url.split("#")[1] || (pageMarker ? "page=" + pageMarker[1] : "");
