  var chinese = language === "zh";
  document.body.classList.toggle("cabin-pdf-focus", Boolean(isPdf && !hasText));
  document.body.classList.toggle("novel-focus", hasText);
  var readerPath = "#/read/" + bookPath + chapter.num;
  var directory = '<details class="novel-directory"><summary>目录</summary><div>' +
    readerWeeks.map(function(item){
      return '<a href="#/read/'+bookPath+item.num+'"'+(item === chapter ? ' aria-current="page"' : '')+'>'+esc(item.title)+'</a>';
    }).join("") + '</div></details>';
  var tools = '<aside class="novel-tools" aria-label="阅读工具">'+languagePicker+directory+'<a href="#/reading">书架</a><a href="#/c/'+bookPath+chapter.num+'">笔记</a>' +
    (isPdf ? '<a href="'+readerPath+'/pdf">原版 PDF</a>' : '') +
    '<details><summary>字号</summary>'+controls+'</details><a href="'+readerPath+'" data-reader-top>回顶部</a></aside>';
  var html = '<main class="container'+(hasText ? ' novel-shell' : isPdf ? ' pdf-reading-shell' : '')+'">'+(hasText ? tools : '<nav class="book-reading-nav" aria-label="阅读入口">' +
    '<a class="note-tab" href="#/reading">书架</a><a class="note-tab" href="#/c/'+bookPath+chapter.num+'">返回本章笔记</a></nav>') +
    '<article class="gx book-reading-page"><p class="book-reading-caption">'+(chinese ? '中文正文' : '英文原文')+'</p><h2>'+esc(hasText && course.id === 'xiaodao' && chapterStart >= 0 ? chapter.title : course.nameCn)+'</h2>';
  if(hasText){
    html += '<div class="book-original-text"></div>';
  } else if(isPdf && original.url){
    html += '<section class="cabin-pdf-reader"><fieldset disabled class="pdf-toolbar" aria-label="PDF 阅读控制">' +
      '<button class="note-tab" type="button" data-turn="-1">← 上一页</button>' +
      '<label>页码 <input aria-label="页码" type="number" min="1" value="1"></label><span class="pdf-total"></span>' +
      '<button class="note-tab" type="button" data-turn="1">下一页 →</button>' +
      '<label>缩放 <select aria-label="缩放"><option value="1">整页</option><option value="1.25">舒适</option><option value="width" selected>适合宽度</option><option value="1.55">放大</option></select></label></fieldset>' +
      '<div role="status">正在加载阅读器…</div><div class="pdf-paper" tabindex="0" aria-label="PDF 页面"></div>' +
      '<div class="pdf-reader-links"><a href="'+esc(original.url)+'" target="_blank" rel="noopener">打开原版 PDF ↗</a></div></section>';
  } else if(original.url){
    var href = esc(original.url);
    html += '<p><a href="'+href+'" target="_blank" rel="noopener">在新窗口打开正文 ↗</a></p>' +
      '<iframe title="'+esc(course.nameCn)+'正文" src="'+href+'" style="display:block;width:100%;height:80vh;border:1px solid var(--line-2)"></iframe>';
  } else {
    html += '<p>这本书暂无可用正文。</p>';
  }
  if(hasText){
    html += '<nav class="book-reading-nav" aria-label="章节翻页">';
    if(readerIndex > 0) html += '<a class="note-tab" href="#/read/'+bookPath+readerWeeks[readerIndex-1].num+'">← 上一章</a>';
    if(readerIndex < readerWeeks.length-1) html += '<a class="note-tab" href="#/read/'+bookPath+readerWeeks[readerIndex+1].num+'">下一章 →</a>';
    else html += '<span>已读到全书末尾</span>';
    html += '</nav>';
  }
  /* 高亮与笔记改为雅思式行内标注（选中正文后浮动工具条操作），不再堆在底部面板 */
  app.innerHTML = html + '</article></main>';
  var page = app.querySelector(".book-reading-page");
  var fab = document.getElementById("ai-fab");
  if(fab){ fab.style.display = "flex"; fab.setAttribute("data-ctx", "书籍：" + (course.nameCn||course.name) + "；本章：" + (chapter.title||"") + "；选中正文后点「问AI」可让我讲解这一段。"); }
  var picker = app.querySelector("[data-reading-language]");
  if(picker) picker.addEventListener("change",function(){
    try{ localStorage.setItem("cabin-reading-language/"+course.id,picker.value); }catch(e){}
    renderBookPage(courseId,termId,chapterNum,preferPdf);
  });
  if(edition){
    var credit = document.createElement("p");
    credit.className = "book-reading-caption";
    credit.textContent = edition.author+" · "+edition.translator+" · "+edition.license;
    page.insertBefore(credit,page.querySelector(".book-original-text"));
  }
  var readable = text;
  if(hasText && isPdf && !edition){
    // Keep string offsets stable so annotations continue to point to the same words.
    readable = text.replace(/[^\n]+\n(?=[^\n]+)/g,function(line, offset){
      var current = line.trim();
      var following = text.slice(offset + line.length).split("\n",1)[0].trim();
      if(!current || !following || /^〔原书第 \d+ 页〕$/.test(current) ||
         /^〔原书第 \d+ 页〕$/.test(following) || /^第[一二三四五六七八九十\d]+[章课]/.test(current) ||
         /[。！？!?][”’」』）)]*$/.test(current)) return line;
      return line.slice(0,-1) + (/\p{Script=Han}/u.test(current + following) ? "\u200b" : " ");
    }).replace(/(?<=\p{Script=Han})[ \t](?=\p{Script=Han})/gu,"\u200b");
  }
  bindBookAnnotations(course.id + (language !== originalLanguage ? "/"+language : ""), page, readable, -1, hasText ? chapterStart : -1, chapterRange ? chapterRange.end : undefined);
  var topLink = app.querySelector("[data-reader-top]");
  if(topLink) topLink.addEventListener("click",function(event){ event.preventDefault(); window.scrollTo(0,0); });
  var pdfReader = page.querySelector(".cabin-pdf-reader");
  if(pdfReader) openPdfReader(pdfReader, original.url, course.id);
  if(!hasText) return;
  var buttons = app.querySelectorAll("[data-book-size]");
  var baseScale = parseFloat(getComputedStyle(page).getPropertyValue("--rf")) || 1;
  function applySize(value){
    var option = sizeOptions.find(function(entry){ return entry[0] === value; }) || sizeOptions[1];
    page.style.setProperty("--rf", baseScale * option[2]);
    buttons.forEach(function(button){
      var active = button.dataset.bookSize === option[0];
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });
    return option[0];
  }
  applySize(size);
  buttons.forEach(function(button){
    button.addEventListener("click", function(){
      var value = applySize(button.dataset.bookSize);
      try{ localStorage.setItem("cabin-book-size", value); }catch(e){}
    });
  });
}

function route(){
  if(/^#\/c\/economics\/term1x(?:\/|$)/.test(location.hash)){
    history.replaceState(history.state, "", location.hash.replace("/economics/term1x", "/economics/term1"));
  }
  document.body.classList.remove("cabin-pdf-focus","novel-focus");
  if(closePdfReader){ closePdfReader(); closePdfReader = null; }
  var hash = location.hash || "#/";
  var navTarget = hash;
  if(hash.indexOf("#/read/")===0){ navTarget = "#/reading"; }
  else if(hash.indexOf("#/c/")===0){
    var cid = hash.slice(4).split("/")[0];
    for(var ci=0; ci<DATA.courses.length; ci++){
      if(DATA.courses[ci].id === cid){ navTarget = DATA.courses[ci].reading ? "#/reading" : (DATA.courses[ci].extra ? "#/extra" : "#/courses"); break; }
    }
  }
  document.querySelectorAll("#mainNav a").forEach(function(a){
    a.classList.toggle("active", a.getAttribute("data-nav") === navTarget);
  });
  var parts = hash.replace(/^#\//,"").split("/").filter(Boolean);
  try{ window.scrollTo(0,0); }catch(e){}
  if(parts.length === 0){ renderHome(); }
  else if(parts[0] === "courses"){ renderCourses(); }
  else if(parts[0] === "extra"){ renderExtra(); }
  else if(parts[0] === "reading"){ renderReading(); }
  else if(parts[0] === "read"){
    app.innerHTML = '<div class="container loading" style="padding:60px 20px;text-align:center;color:#5a7392">📖 正在加载读书数据…</div>';
    ensureReadingData().then(function(){
      if(location.hash !== hash) return;
      renderBookPage(parts[1], parts[2], Number(parts[3]), parts[4] === "pdf");
    }).catch(function(){
      if(location.hash !== hash) return;
      app.innerHTML = '<div class="container loading" style="padding:60px 20px;text-align:center;color:#a35">读书数据加载失败，请检查网络后刷新页面。</div>';
    });
  }
  else if(parts[0] === "plan"){ location.hash = "#/prep"; return; }
  else if(parts[0] === "prep"){ renderPrepCenter(); }
  else if(parts[0] === "plan"){ renderStudyPlan(); }
  else if(parts[0] === "c" && parts[1]){
    if(parts[3] === "review"){ renderCourse(parts[1], parts[2] || null, "review"); }
    else { renderCourse(parts[1], parts[2] || null, parts[3] ? parseInt(parts[3],10) : null); }
  }
  else if(parts[0] === "assistant"){ renderAssistant(); }
  else if(parts[0] === "english"){ location.replace("english/index.html"); return; }
  else if(parts[0] === "profile" || parts[0].indexOf("profile?") === 0){
    /* 支持 ?type=exam 预填类型 */
    var qIdx = location.hash.indexOf("?");
    var prefillType = null;
    if(qIdx > -1){
      var qs = location.hash.slice(qIdx + 1);
      var pm = qs.match(/type=(exam|quiz|practice)/);
      if(pm) prefillType = pm[1];
    }
    renderProfile(prefillType);
  }
  else if(parts[0] === "guide"){ location.replace("#/"); }
  else { renderHome(); }
}

/* ---------- boot ---------- */
function shade(hex, amt){
  var m = hex.replace("#","");
  if(m.length===3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
  var r = Math.max(0,Math.min(255,parseInt(m.substr(0,2),16)+amt));
  var g = Math.max(0,Math.min(255,parseInt(m.substr(2,2),16)+amt));
  var b = Math.max(0,Math.min(255,parseInt(m.substr(4,2),16)+amt));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

  (function autoJumpToNotes(){
    var h = location.hash || "";
    if(h && h !== "#" && h !== "#/") return; /* 已有明确路由（如分享链接），不覆盖 */
    var tgt = null;
    if(state.lastCourse && state.lastCourse.cid){
      var lc = findCourse(state.lastCourse.cid);
      if(lc && !lc.reading && !lc.extra) tgt = { c: lc, t: state.lastCourse.tid || (lc.terms[0] && lc.terms[0].id) };
    }
    if(!tgt){
      var fm = DATA.courses.filter(function(x){ return !x.reading && !x.extra; })[0];
      if(fm) tgt = { c: fm, t: fm.terms[0] && fm.terms[0].id };
    }
    if(tgt && tgt.t){
      if(history.replaceState) history.replaceState(null, "", "#/c/" + tgt.c.id + "/" + tgt.t);
      else location.hash = "#/c/" + tgt.c.id + "/" + tgt.t;
    }
  })();
  route();
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-nav]");
  if(el){
    ev.preventDefault();
    var h = el.getAttribute("data-nav");
    if(location.hash === h){ route(); } else { location.hash = h; }
  }
});

/* 移动端汉堡菜单：展开/收起顶部导航（手机/平板 ≤960px 生效） */
(function(){
  var toggle = document.getElementById("navToggle");
  var header = document.querySelector(".site-header");
  var nav = document.getElementById("mainNav");
  if(!toggle || !header || !nav) return;
  function setOpen(open){
    header.classList.toggle("nav-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
  }
  toggle.addEventListener("click", function(e){
    e.stopPropagation();
    setOpen(!header.classList.contains("nav-open"));
  });
  /* 点击菜单内任一链接后自动收起 */
  nav.addEventListener("click", function(e){
    if(e.target.closest("a")) setOpen(false);
  });
  /* 点击菜单外部自动收起 */
  document.addEventListener("click", function(e){
    if(header.classList.contains("nav-open") && !e.target.closest(".site-header")) setOpen(false);
  });
  /* 路由切换（含浏览器前进/后退）后收起，避免停留在展开态 */
  window.addEventListener("hashchange", function(){ setOpen(false); });
})();

<!-- 字号调节（网络小说式） -->
<div id="font-ctrl" class="font-ctrl" role="group" aria-label="字号调节">
  <span class="fc-label">字号</span>
  <button type="button" data-fs="small"  class="fc-btn" title="小（正文约 10px）">小</button>
  <button type="button" data-fs="medium" class="fc-btn" title="中（正文约 13px）">中</button>
  <button type="button" data-fs="large"  class="fc-btn" title="大（正文约 16px）">大</button>
</div>
<script>
(function(){
  var ctrl=document.getElementById('font-ctrl');
  if(!ctrl){return;}
  var KEY='xinnan-readfont';
  function apply(fs){
    document.body.classList.remove('rf-small','rf-medium','rf-large');
    document.body.classList.add('rf-'+fs);
    var btns=ctrl.querySelectorAll('.fc-btn');
    for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].getAttribute('data-fs')===fs); }
    try{ localStorage.setItem(KEY, fs); }catch(e){}
  }
  var btns=ctrl.querySelectorAll('.fc-btn');
  for(var i=0;i<btns.length;i++){
    (function(b){ b.addEventListener('click', function(){ apply(b.getAttribute('data-fs')); }); })(btns[i]);
  }
  var saved='medium';
  try{ saved=localStorage.getItem(KEY)||'medium'; }catch(e){}
  if(saved!=='small'&&saved!=='medium'&&saved!=='large'){ saved='medium'; }
  apply(saved);
})();
</script>
